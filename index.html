/* ============================================================
   Utilidades de transporte
   ============================================================ */

function apiConfigurada() {
  return /^https:\/\//i.test(texto(CONFIG.api.url));
}

function conTimeout(promesaFn, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return promesaFn(ctrl.signal).finally(() => clearTimeout(t));
}

const espera = ms => new Promise(r => setTimeout(r, ms));

async function conReintentos(fn, intentos, baseMs) {
  let ultimo;
  for (let i = 0; i <= intentos; i++) {
    try {
      return await fn();
    } catch (err) {
      ultimo = (err && err.name === "AbortError") ? new Error("TIMEOUT") : err;
      if (err && err.noReintentar) throw err;
      if (i < intentos) {
        const espMs = baseMs * Math.pow(2, i);
        log(`reintento ${i + 1}/${intentos} en ${espMs}ms`, err.message);
        await espera(espMs);
      }
    }
  }
  throw ultimo;
}

function urlCon(params) {
  const u = new URL(CONFIG.api.url);
  Object.entries(params || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") u.searchParams.set(k, v);
  });
  u.searchParams.set("t", Date.now());   // evita caché intermedia
  return u.toString();
}

/** GET contra el Web App. Devuelve el payload JSON crudo. */
async function get(params) {
  if (!apiConfigurada()) throw new Error("API_NO_CONFIGURADA");
  return conReintentos(
    () => conTimeout(async signal => {
      const r = await fetch(urlCon(params), { method: "GET", redirect: "follow", signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const txt = await r.text();
      let payload;
      try { payload = JSON.parse(txt); } catch { throw new Error("RESPUESTA_INVALIDA"); }
      // Errores transitorios del backend (cuota, bloqueo, arranque en frío): se reintentan
      if (payload && payload.success === false) {
        const code = (payload.error && payload.error.code) || "";
        if (code !== "INTERNAL_ERROR" && code !== "BUSY") return payload;
        throw new Error(code);
      }
      return payload;
    }, CONFIG.api.timeoutMs),
    CONFIG.api.reintentos,
    CONFIG.api.reintentoBaseMs
  );
}

/**
 * POST contra el Web App.
 * Content-Type text/plain a propósito: Apps Script no responde el
 * preflight OPTIONS que dispararía application/json.
 */
async function post(cuerpo, timeoutMs) {
  if (!apiConfigurada()) throw new Error("API_NO_CONFIGURADA");
  return conReintentos(
    () => conTimeout(async signal => {
      const r = await fetch(CONFIG.api.url, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": CONFIG.api.postContentType },
        body: JSON.stringify(cuerpo),
        signal
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const txt = await r.text();
      try { return JSON.parse(txt); } catch { throw new Error("RESPUESTA_INVALIDA"); }
    }, timeoutMs || CONFIG.api.timeoutMs),
    0,                       // las escrituras NO se reintentan (evita duplicados)
    CONFIG.api.reintentoBaseMs
  );
}

/** Desempaqueta la respuesta estándar {success, data, error}. */
function desempaquetar(payload) {
  if (payload && typeof payload === "object" && "success" in payload) {
    if (payload.success) return payload.data;
    const e = new Error((payload.error && payload.error.code) || "ERROR_BACKEND");
    e.detalle = payload.message || "";
    e.errores = (payload.error && payload.error.details) || [];
    throw e;
  }
  return payload;   // compatibilidad con respuestas antiguas (array plano)
}

/* ============================================================
   Caché temporal (memoria + sessionStorage)
   ============================================================ */
let cacheMem = null;

function leerCache() {
  if (cacheMem && Date.now() - cacheMem.ts < CONFIG.datos.cacheTtlMs) return cacheMem.data;
  try {
    const raw = sessionStorage.getItem(CONFIG.datos.cacheKey);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts >= CONFIG.datos.cacheTtlMs) return null;
    cacheMem = obj;
    return obj.data;
  } catch {
    return null;
  }
}

function guardarCache(data) {
  const obj = { ts: Date.now(), data };
  cacheMem = obj;
  try {
    sessionStorage.setItem(CONFIG.datos.cacheKey, JSON.stringify(obj));
  } catch {
    /* cuota llena o modo privado: la caché en memoria sigue funcionando */
  }
}

function invalidarCache() {
  cacheMem = null;
  try { sessionStorage.removeItem(CONFIG.datos.cacheKey); } catch { /* noop */ }
}

/* ============================================================
   Normalización: filas de la hoja -> modelo interno
   ============================================================ */

/** Hue determinístico en banda fría (190–288) a partir del nombre de marca. */
function hueFor(nombre) {
  let h = 0;
  const s = String(nombre || "");
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100000;
  return 190 + (h % 99);
}

function campo(fila, mapa, nombres) {
  for (const n of nombres) {
    const k = mapa[norm(n)];
    if (k !== undefined) {
      const v = texto(fila[k]);
      if (v !== "") return v;
    }
  }
  return "";
}

/**
 * Convierte las filas de la hoja en el dataset que consume la UI.
 * Tolerante: una fila incompleta no rompe la carga, se degrada.
 */
function construirDataset(filas, config) {
  config = config || {};
  const rows = Array.isArray(filas) ? filas.filter(r => r && typeof r === "object") : [];
  if (!rows.length) throw new Error("HOJA_VACIA");

  const mapa = {};
  Object.keys(rows[0]).forEach(k => { mapa[norm(k)] = k; });

  const chequeo = validarEncabezados(Object.keys(rows[0]));
  if (!chequeo.valido) log("Encabezados faltantes en la hoja:", chequeo.faltantes);

  const brands = {};
  const monthsSet = {};
  const categoriasSet = {};
  let maxFecha = "";

  const actions = rows.map((fila, i) => {
    const marca = campo(fila, mapa, ["Marca"]) || "Sin marca";
    const grupo = campo(fila, mapa, ["Grupo", "Grupo económico", "Grupo economico"]);
    const fp = parseFecha(campo(fila, mapa, ["Fecha"]));
    const mes = fp ? `${fp.y}-${pad2(fp.mo)}` : "sin-fecha";
    const fecha = fp ? `${fp.y}-${pad2(fp.mo)}-${pad2(fp.d)}` : "";
    if (fecha > maxFecha) maxFecha = fecha;

    const categoria = campo(fila, mapa, ["Categoría", "Categoria"]) || "General";
    const imagenRaw = campo(fila, mapa, ["Imagen principal", "Imagen"]);
    const imagen = urlImagenDirecta(imagenRaw);

    const adicionales = splitList(
      campo(fila, mapa, ["Imágenes adicionales", "Imagenes adicionales", "Imágenes", "Galería", "Galeria"])
    ).map(urlImagenDirecta).filter(Boolean);

    const galeria = [imagen, ...adicionales]
      .filter(Boolean)
      .filter((v, idx, arr) => arr.indexOf(v) === idx)     // sin duplicados
      .slice(0, CONFIG.datos.maxImagenesGaleria);

    const descripcion = campo(fila, mapa, ["Descripción", "Descripcion"]);

    if (!brands[marca]) brands[marca] = { hue: hueFor(marca), name: marca, grupo: grupo || "" };
    else if (grupo && !brands[marca].grupo) brands[marca].grupo = grupo;

    if (fp) {
      monthsSet[mes] = {
        key: mes,
        label: cap(MESES[fp.mo - 1]),
        short: cap(MESES[fp.mo - 1]).slice(0, 3),
        year: fp.y
      };
    }
    if (categoria) categoriasSet[categoria] = true;

    const idHoja = campo(fila, mapa, ["ID"]);

    return {
      id: idHoja || "a" + pad2(i + 1),
      mes, fecha,
      fechaLabel: fechaLegible(fp),
      marca,
      grupo,
      categoria,
      subcategoria: campo(fila, mapa, ["Subcategoría", "Subcategoria"]) || categoria,
      tipo: campo(fila, mapa, ["Tipo de acción", "Tipo de accion", "Tipo"]) || "Acción",
      titulo: campo(fila, mapa, ["Título", "Titulo"]) || "(Sin título)",
      resumen: campo(fila, mapa, ["Resumen"]) || descripcion.slice(0, 160),
      descripcion,
      sku: campo(fila, mapa, ["SKU involucrado", "SKU"]) || "—",
      canal: splitList(campo(fila, mapa, ["Canal", "Canales"])),
      ubicacion: campo(fila, mapa, ["Ubicación", "Ubicacion"]) || "—",
      fuente: campo(fila, mapa, ["Fuente"]) || "—",
      insight: campo(fila, mapa, ["Insight", "Insight estratégico", "Insight estrategico"]),
      link: urlSegura(campo(fila, mapa, ["Link de referencia", "Link", "Enlace"])),
      imagen: imagen || null,
      galeria,
      estado: campo(fila, mapa, ["Estado"]) || "Publicado",
      fila: i + 2                       // fila real en la hoja (1 = encabezados)
    };
  });

  const months = Object.values(monthsSet).sort((a, b) => a.key.localeCompare(b.key));
  const currentMonth = config.currentMonth || (months.length ? months[months.length - 1].key : "");

  return finalizar({
    edicion: config.edicion || months.length,
    cliente: config.cliente || CONFIG.marca.nombre,
    producto: config.producto || CONFIG.marca.producto,
    currentMonth,
    maxFecha,
    brands,
    months,
    categorias: Object.keys(categoriasSet).sort(),
    actions
  });
}

/** Campos derivados que alimentan filtros e indicadores. */
function finalizar(data) {
  data.actions = data.actions || [];
  data.brands = data.brands || {};
  data.months = data.months || [];
  data.categorias = data.categorias || [];

  // Reconstruye marcas faltantes (protege al Detalle de un acceso a undefined)
  data.actions.forEach(a => {
    if (!a.marca) a.marca = "Sin marca";
    if (!data.brands[a.marca]) data.brands[a.marca] = { hue: hueFor(a.marca), name: a.marca, grupo: "" };
    if (!Array.isArray(a.canal)) a.canal = splitList(a.canal);
    if (!Array.isArray(a.galeria)) a.galeria = [];
    if (!("imagen" in a)) a.imagen = null;
    if (!a.link || !esUrl(a.link)) a.link = "";
    if (!a.estado) a.estado = "Publicado";
  });

  data.tipos = Array.from(new Set(data.actions.map(a => a.tipo).filter(Boolean))).sort();
  data.canales = Array.from(new Set(data.actions.flatMap(a => a.canal))).sort();
  data.subcategorias = Array.from(new Set(data.actions.map(a => a.subcategoria).filter(Boolean))).sort();
  data.ubicaciones = Array.from(new Set(data.actions.map(a => a.ubicacion).filter(v => v && v !== "—"))).sort();
  data.fuentes = Array.from(new Set(data.actions.map(a => a.fuente).filter(v => v && v !== "—"))).sort();

  if (!data.maxFecha) {
    data.maxFecha = data.actions.reduce((mx, a) => (a.fecha > mx ? a.fecha : mx), "");
  }
  if (!data.currentMonth && data.months.length) {
    data.currentMonth = data.months[data.months.length - 1].key;
  }
  return data;
}

/* ============================================================
   Brandg · Radar Competitivo — Capa de interfaz
   ------------------------------------------------------------
   Construcción de DOM con createElement + textContent.
   No se usa innerHTML con datos de la hoja (prevención de XSS).
   Los textos visibles se conservan tal cual del proyecto original.
   ============================================================ */

/* ============================================================
   Helper de construcción de DOM
   ============================================================ */
function h(tag, props, ...hijos) {
  const el = document.createElement(tag);
  const p = props || {};
  for (const [k, v] of Object.entries(p)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  agregar(el, hijos);
  return el;
}

function agregar(el, hijos) {
  for (const c of hijos.flat(4)) {
    if (c === null || c === undefined || c === false || c === true) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

const svgNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, ...hijos) {
  const el = document.createElementNS(svgNS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v !== null && v !== undefined) el.setAttribute(k, v);
  });
  hijos.flat(3).filter(Boolean).forEach(c => el.appendChild(c));
  return el;
}

/* ============================================================
   Poster — imagen real con degradado de respaldo
   ============================================================ */
function Poster(action, opts = {}) {
  const { monogram = true, label = true, size = "md" } = opts;
  const src = ("img" in opts) ? opts.img : action.imagen;
  const meta = (V && V.brands[action.marca]) || {};
  const hue = meta.hue || 230;
  const idx = V ? Object.keys(V.brands).indexOf(action.marca) : 0;
  const ang = 112 + Math.max(0, idx) * 17;
  const c1 = `oklch(0.40 0.16 ${hue})`;
  const c2 = "oklch(0.80 0.105 192)";
  const gram = String(action.marca || "?").split(" ").map(w => w[0]).join("").slice(0, 2);
  const mgSize = size === "lg" ? "clamp(90px,16vw,200px)" : size === "sm" ? "44px" : "84px";

  const cont = h("div", {
    class: "poster",
    style: { "--c1": c1, "--c2": c2, "--ang": ang + "deg" }
  });

  const usarImg = src && esUrl(src);
  if (usarImg) {
    cont.dataset.hasImg = "1";
    const img = h("img", {
      class: "poster-img", src, alt: action.titulo || "Evidencia", loading: "lazy", decoding: "async"
    });
    img.addEventListener("load", () => img.classList.add("cargada"));
    img.addEventListener("error", () => {
      delete cont.dataset.hasImg;
      img.remove();
      cont.prepend(fondoGenerativo(monogram, gram, mgSize));
      cont.appendChild(h("span", { class: "poster-err", text: "Imagen no disponible" }));
    });
    cont.appendChild(img);
  } else {
    cont.appendChild(fondoGenerativo(monogram, gram, mgSize));
  }

  if (label) {
    cont.appendChild(h("div", { class: "mono-tag" },
      svg("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.6", "aria-hidden": "true" },
        svg("rect", { x: 3, y: 3, width: 18, height: 18, rx: 2 }),
        svg("path", { d: "m3 16 5-5 4 4 4-4 5 5" }),
        svg("circle", { cx: 8.5, cy: 8.5, r: 1.5 })
      ),
      h("span", { text: `${String(action.marca).toUpperCase()} · ${String(action.tipo).toUpperCase()}` })
    ));
  }
  return cont;
}

function fondoGenerativo(monogram, gram, mgSize) {
  const frag = document.createDocumentFragment();
  frag.appendChild(h("div", { class: "wash" }));
  frag.appendChild(h("div", { class: "stripes" }));
  if (monogram) frag.appendChild(h("div", { class: "monogram", style: { fontSize: mgSize }, text: gram }));
  return frag;
}

/* ============================================================
   EXPLORADOR
   ============================================================ */
function Explorer(ctx) {
  const f = { mes: "", marca: "", categoria: "", tipo: "", canal: "", ...(ctx.filtros || {}) };
  let q = ctx.query || "";
  let limite = CONFIG.datos.tamanoPagina;

  const grid = h("div", { class: "grid", id: "grid-resultados" });
  const contador = h("span", { class: "result-count" });
  const zonaResultados = h("section", { class: "shell zona-resultados" }, grid);
  const btnMas = h("button", { class: "btn ghost", style: { margin: "34px auto 0", display: "none" } },
    "Cargar más resultados ", I("arrow", 15));

  const inputBusqueda = h("input", {
    type: "search", value: q, "aria-label": "Buscar acciones",
    placeholder: "Buscar acciones, marcas, insights, SKU…"
  });

  function filtrar() {
    const term = q.trim().toLowerCase();
    return V.actions.filter(a => {
      if (f.mes && a.mes !== f.mes) return false;
      if (f.marca && a.marca !== f.marca) return false;
      if (f.categoria && a.categoria !== f.categoria) return false;
      if (f.tipo && a.tipo !== f.tipo) return false;
      if (f.canal && !a.canal.includes(f.canal)) return false;
      if (term) {
        const heno = [a.titulo, a.resumen, a.descripcion, a.marca, a.tipo, a.insight, a.sku, a.ubicacion, a.fuente]
          .join(" ").toLowerCase();
        if (!heno.includes(term)) return false;
      }
      return true;
    }).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  }

  function pintar(conEscaneo) {
    const res = filtrar();
    contador.textContent = `${res.length} ${res.length === 1 ? "resultado" : "resultados"}`;
    grid.textContent = "";

    if (!res.length) {
      zonaResultados.classList.add("vacio");
      grid.appendChild(EstadoVacio("Sin resultados", "Ajusta los filtros o limpia la búsqueda.",
        h("button", { class: "btn ghost", style: { marginTop: "20px" }, onclick: limpiar }, "Limpiar filtros")));
      btnMas.style.display = "none";
      return;
    }
    zonaResultados.classList.remove("vacio");
    const visibles = res.slice(0, limite);
    const frag = document.createDocumentFragment();
    visibles.forEach((a, i) => frag.appendChild(ActionCard(a, ctx.onOpen, i, ctx.onPortada)));
    grid.appendChild(frag);
    btnMas.style.display = res.length > limite ? "flex" : "none";
    Anim.revelar(grid);
    if (conEscaneo) Anim.escanear(grid);
  }

  function limpiar() {
    Object.keys(f).forEach(k => (f[k] = ""));
    q = "";
    inputBusqueda.value = "";
    limite = CONFIG.datos.tamanoPagina;
    barra.querySelectorAll("select").forEach(s => { s.value = ""; s.classList.remove("set"); });
    actualizarLimpiar();
    ctx.setFiltros({}, "");
    pintar(true);
  }

  function selector(k, label, opts) {
    const sel = h("select", {
      class: "fselect" + (f[k] ? " set" : ""), "aria-label": label, value: f[k],
      onchange: e => {
        f[k] = e.target.value;
        e.target.classList.toggle("set", !!e.target.value);
        limite = CONFIG.datos.tamanoPagina;
        actualizarLimpiar();
        ctx.setFiltros(f, q);
        pintar(true);
      }
    },
      h("option", { value: "", text: label }),
      ...opts.map(o => h("option", { value: o.v ?? o, text: o.l ?? o }))
    );
    sel.value = f[k] || "";
    return h("div", { class: "select-wrap" }, sel);
  }

  const btnLimpiar = h("button", { class: "clear-btn", onclick: limpiar, text: "Limpiar ✕" });
  function actualizarLimpiar() {
    const activo = Object.values(f).some(Boolean) || !!q.trim();
    btnLimpiar.style.display = activo ? "" : "none";
  }

  let tDebounce;
  inputBusqueda.addEventListener("input", e => {
    q = e.target.value;
    clearTimeout(tDebounce);
    tDebounce = setTimeout(() => {
      limite = CONFIG.datos.tamanoPagina;
      actualizarLimpiar();
      ctx.setFiltros(f, q);
      pintar(true);
    }, CONFIG.datos.debounceBusquedaMs);
  });

  btnMas.addEventListener("click", () => {
    limite += CONFIG.datos.tamanoPagina;
    pintar(false);
  });

  const barra = h("div", { class: "filterbar" },
    h("div", { class: "shell", style: { display: "flex", flexDirection: "column", gap: "12px" } },
      h("div", { class: "filter-row" },
        h("label", { class: "search" },
          I("search", 17),
          inputBusqueda,
          h("kbd", { text: "⌘K" })
        )
      ),
      h("div", { class: "filter-row" },
        selector("mes", "Mes", V.months.map(m => ({ v: m.key, l: `${m.label} ${m.year}` }))),
        selector("marca", "Marca", Object.keys(V.brands)),
        selector("categoria", "Categoría", V.categorias),
        selector("tipo", "Tipo de acción", V.tipos),
        selector("canal", "Canal", V.canales),
        btnLimpiar,
        contador
      )
    )
  );

  const vista = h("div", { class: "view" }, barra, zonaResultados, h("div", { class: "shell centrado" }, btnMas));

  const atajo = e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); inputBusqueda.focus(); }
  };
  window.addEventListener("keydown", atajo);
  ctx.alSalir(() => window.removeEventListener("keydown", atajo));

  actualizarLimpiar();
  pintar(false);
  return vista;
}

            h("p", { text: `Sobre un total de ${all.length} ${all.length === 1 ? "acción" : "acciones"} monitoreadas, "${(byTipo[0] && byTipo[0].k) || "—"}" es el tipo de movimiento más recurrente del histórico. Explora el detalle de cada marca y tipo de acción en el Explorador.` })
          )

      h("div", { class: "insight-cards" },

        ),

          h("div", { class: "rank-list" },

/* ============================================================
   COMPARADOR
   ============================================================ */
function Compare(ctx) {
  if (V.months.length < 2) {
    return h("div", { class: "view" },
      h("section", { class: "section-pad shell" },
        h("div", { class: "section-head" },
          h("div", {},
            h("div", { class: "eyebrow", style: { marginBottom: "12px" }, text: "Comparador histórico" }),
            h("h2", { class: "section-title", text: "Mes contra mes" })
          )
        ),
        EstadoVacio("Aún no hay suficientes meses para comparar",
          "Agrega acciones de al menos dos meses distintos en Google Sheets para usar el comparador.")
      )
    );
  }

  let a = ctx.compareA || V.months[V.months.length - 2].key;
  let b = ctx.compareB || V.months[V.months.length - 1].key;

  const stats = key => {
    const acts = actionsByMonth(key);
    const c = {};
    acts.forEach(x => (c[x.marca] = (c[x.marca] || 0) + 1));
    return {
      total: acts.length,
      brands: [...new Set(acts.map(x => x.marca))],
      launches: acts.filter(x => /Lanzamiento|Relanzamiento/i.test(x.tipo)).length,
      topBrand: (Object.entries(c).sort((p, q) => q[1] - p[1])[0] || ["—"])[0],
      acts
    };
  };

  const contenido = h("div", { class: "cmp-contenido" });

  function selMes(valor, alCambiar) {
    const s = h("select", {
      class: "fselect set", "aria-label": "Mes a comparar",
      style: { height: "48px", fontSize: "16px", fontFamily: "var(--serif)" },
      onchange: e => alCambiar(e.target.value)
    }, ...V.months.map(m => h("option", { value: m.key, text: `${m.label} ${m.year}` })));
    s.value = valor;
    return h("div", { class: "select-wrap" }, s);
  }

  function columna(s, mk) {
    const m = V.months.find(x => x.key === mk) || { label: mk };
    return h("div", { class: "cmp-col" },
      h("h4", { text: m.label }),
      h("div", { class: "sub", text: monthLabel(mk).toUpperCase() }),
      h("div", { class: "cmp-stat" }, h("span", { class: "k", text: "Acciones totales" }), h("span", { class: "v", text: String(s.total) })),
      h("div", { class: "cmp-stat" }, h("span", { class: "k", text: "Marcas activas" }), h("span", { class: "v", text: String(s.brands.length) })),
      h("div", { class: "cmp-stat" }, h("span", { class: "k", text: "Lanzamientos" }), h("span", { class: "v", text: String(s.launches) })),
      h("div", { class: "cmp-stat" }, h("span", { class: "k", text: "Marca más activa" }), h("span", { class: "v", style: { fontSize: "20px" }, text: s.topBrand }))
    );
  }

  function pintar() {
    const sa = stats(a), sb = stats(b);
    const delta = sb.total - sa.total;
    const nuevas = sb.brands.filter(x => !sa.brands.includes(x));
    const mb = V.months.find(m => m.key === b) || { label: b };
    const grid = h("div", { class: "grid" }, ...sb.acts.map((x, i) => ActionCard(x, ctx.onOpen, i)));

    contenido.textContent = "";
    agregar(contenido, [
      h("div", { class: "cmp-delta-row" },
        h("span", { class: "cmp-delta-big " + (delta >= 0 ? "up" : "down"), text: (delta > 0 ? "+" : "") + delta }),
        h("div", {},
          h("div", { style: { fontWeight: 600 },
            text: `${delta > 0 ? "Más actividad" : delta < 0 ? "Menos actividad" : "Misma actividad"} en ${mb.label}` }),
          h("div", { style: { color: "var(--ink-3)", fontSize: "13px" },
            text: delta !== 0
              ? `${Math.abs(Math.round((delta / Math.max(sa.total, 1)) * 100))}% ${delta > 0 ? "de aumento" : "de caída"} en el volumen de acciones`
              : "El volumen se mantuvo estable" })
        )
      ),
      h("div", { class: "cmp-grid" }, columna(sa, a), columna(sb, b)),
      nuevas.length
        ? h("div", { class: "exec-card", style: { marginTop: "24px" } },
            h("div", { class: "eyebrow", text: "Cambios de estrategia" }),
            h("h4", { style: { fontSize: "22px", margin: "10px 0" }, text: `Nuevas marcas entran al radar en ${mb.label}` }),
            h("div", { style: { display: "flex", gap: "10px", flexWrap: "wrap", marginTop: "6px" } },
              ...nuevas.map(nb => h("span", { class: "brand-tab" },
                h("span", { class: "swatch", style: { background: brandColor(nb, 0.6, 0.18) } }), nb)))
          )
        : null,
      h("div", { style: { marginTop: "48px" } },
        h("div", { class: "eyebrow", style: { marginBottom: "18px" }, text: `Acciones de ${mb.label}` }),
        sb.acts.length ? grid : EstadoVacio("Sin acciones en este mes", "Elige otro período para comparar.")
      )
    ]);
    requestAnimationFrame(() => Anim.revelar(grid));
  }

  const selectores = h("div", { class: "cmp-selectors" },
    selMes(a, v => { a = v; ctx.setCompare(a, b); pintar(); }),
    h("span", { class: "cmp-vs", text: "vs" }),
    selMes(b, v => { b = v; ctx.setCompare(a, b); pintar(); })
  );

  const vista = h("div", { class: "view" },
    h("section", { class: "section-pad shell" },
      h("div", { class: "section-head" },
        h("div", {},
          h("div", { class: "eyebrow", style: { marginBottom: "12px" }, text: "Comparador histórico" }),
          h("h2", { class: "section-title", text: "Mes contra mes" })
        ),
        h("p", { class: "section-desc", text: "Mide la variación de actividad competitiva entre dos períodos: volumen, marcas activas, nuevos lanzamientos y cambios de estrategia." })
      ),
      selectores,
      contenido
    )
  );

  pintar();
  return vista;
}

/* ============================================================
   EDICIÓN EN LÍNEA — infraestructura compartida
   ============================================================ */

/**
 * Obtiene el token de escritura.
 * Si el backend está en modo abierto (WRITE_MODE = open) devuelve "".
 * Si ya está guardado en el navegador lo reutiliza.
 * Si no, lo pide una sola vez y lo recuerda.
 */
async function asegurarToken() {
  if (API.escritura.consultada && !API.escritura.requiereToken) return "";
  const guardado = API.tokenEscritura();
  if (guardado) return guardado;
  const ingresado = await pedirToken();
  if (!ingresado) throw new Error("SIN_TOKEN");
  API.guardarTokenEscritura(ingresado);
  return ingresado;
}

/** Modal mínimo que pide el token una única vez. */
function pedirToken(mensaje) {
  return new Promise(resolve => {
    const campo = h("input", { type: "password", autocomplete: "off", id: "tok-input", placeholder: "Token de escritura" });
    const cerrar = valor => { document.removeEventListener("keydown", onKey); caja.remove(); resolve(valor); };
    const onKey = e => {
      if (e.key === "Escape") cerrar("");
      if (e.key === "Enter") cerrar(campo.value.trim());
    };
    const caja = h("div", { class: "token-overlay", role: "dialog", "aria-modal": "true", "aria-label": "Token de escritura" },
      h("div", { class: "token-panel" },
        h("div", { class: "eyebrow", text: "Permiso de escritura" }),
        h("h3", { text: "Ingresa el token para guardar cambios" }),
        h("p", { text: mensaje || "Obtén el token ejecutando verToken() en el editor de Apps Script. Queda guardado en este navegador; no se te volverá a pedir." }),
        campo,
        h("div", { class: "token-acciones" },
          h("button", { class: "btn ghost", onclick: () => cerrar("") }, "Cancelar"),
          h("button", { class: "btn", onclick: () => cerrar(campo.value.trim()) }, "Guardar token")
        )
      )
    );
    caja.addEventListener("click", e => { if (e.target === caja) cerrar(""); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(caja);
    setTimeout(() => campo.focus(), 30);
  });
}

/**
 * Autoguardado con antirrebote y cola de una sola petición en vuelo.
 * Devuelve { programar, forzar, estado }.
 */
function crearAutoguardado(action, indicador) {
  let temporizador = null;
  let enVuelo = false;
  let pendiente = false;

  function pintar(estado, detalle) {
    indicador.dataset.estado = estado;
    indicador.textContent =
      estado === "guardando" ? "Guardando…" :
      estado === "ok" ? "Guardado " + new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }) :
      estado === "error" ? "Sin guardar · " + (detalle || "error") :
      estado === "sucio" ? "Cambios sin guardar" : "Sincronizado";
  }

  async function ejecutar() {
    if (enVuelo) { pendiente = true; return; }
    enVuelo = true;
    pintar("guardando");
    try {
      throw new Error("ONEDRIVE_PENDIENTE");
      const token = await asegurarToken();
      await API.guardarAccion(action, token);
      pintar("ok");
    } catch (err) {
      const codigo = (err && err.message) || "";
      if (codigo === "ONEDRIVE_PENDIENTE") {
        pintar("error", "conexión a OneDrive pendiente");
        toast("Conexión a OneDrive pendiente. Estos cambios no se han guardado.", "info");
      } else if (codigo === "SIN_TOKEN") {
        pintar("error", "falta el token");
      } else if (codigo === "UNAUTHORIZED") {
        API.olvidarTokenEscritura();
        pintar("error", "token inválido");
        toast("El token de escritura no es válido. Ejecuta verToken() en Apps Script.", "error");
      } else {
        pintar("error", (err && err.detalle) || codigo || "error de red");
        toast("No se pudieron guardar los cambios: " + ((err && err.detalle) || codigo), "error");
      }
    } finally {
      enVuelo = false;
      if (pendiente) { pendiente = false; ejecutar(); }
    }
  }

  return {
    programar() {
      pintar("sucio");
      clearTimeout(temporizador);
      temporizador = setTimeout(ejecutar, CONFIG.edicion.autoguardadoMs);
    },
    forzar() { clearTimeout(temporizador); ejecutar(); },
    pintar
  };
}

/**
 * Convierte un nodo en campo editable en línea.
 * @param {HTMLElement} el
 * @param {{leer:Function, escribir:Function, etiqueta:string, unaLinea?:boolean, vacio?:string}} enlace
 * @param {{programar:Function}} auto
 */
function editable(el, enlace, auto) {
  if (!CONFIG.edicion.habilitada) { el.textContent = enlace.leer() || enlace.vacio || ""; return el; }

  const valor = enlace.leer();
  el.textContent = valor || "";
  el.classList.add("editable");
  el.dataset.vacio = enlace.vacio !== undefined ? enlace.vacio : "Sin información";
  el.setAttribute("contenteditable", "plaintext-only");
  if (el.contentEditable !== "plaintext-only") el.setAttribute("contenteditable", "true");
  el.setAttribute("role", "textbox");
  el.setAttribute("aria-label", enlace.etiqueta);
  el.setAttribute("spellcheck", "false");
  el.setAttribute("tabindex", "0");

  el.addEventListener("input", () => {
    enlace.escribir(el.textContent.replace(/\s+/g, " ").trimStart());
    auto.programar();
  });
  el.addEventListener("paste", e => {
    e.preventDefault();
    const texto = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, String(texto).replace(/\r?\n/g, enlace.unaLinea ? " " : "\n"));
  });
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" && enlace.unaLinea) { e.preventDefault(); el.blur(); }
    e.stopPropagation();                       // no cerrar el modal al escribir
  });
  el.addEventListener("blur", () => {
    const limpio = el.textContent.trim();
    el.textContent = limpio;
    enlace.escribir(limpio);
  });
  return el;
}

/* ============================================================
   DETALLE (modal) — ficha editable del hallazgo
   ============================================================ */
function Detail(action, ctx) {
  const related = V.actions
    .filter(x => x.id !== action.id && (x.marca === action.marca || x.tipo === action.tipo))
    .slice(0, 3);

/* ============================================================
   LIGHTBOX de evidencias
   ============================================================ */
function abrirLightbox(imagenes, indice, titulo) {
  const lista = (imagenes || []).filter(esUrl);
  if (!lista.length) return;
  let i = Math.max(0, Math.min(indice, lista.length - 1));

  const img = h("img", { src: lista[i], alt: titulo || "Evidencia", class: "lb-img" });
  const contadorEl = h("span", { class: "lb-count", text: `${i + 1} / ${lista.length}` });

  const ir = paso => {
    i = (i + paso + lista.length) % lista.length;
    img.src = lista[i];
    contadorEl.textContent = `${i + 1} / ${lista.length}`;
  };

  const cerrar = () => {
    document.removeEventListener("keydown", onKey);
    document.body.style.overflow = previo;
    caja.remove();
  };
  const onKey = e => {
    if (e.key === "Escape") cerrar();
    if (e.key === "ArrowRight") ir(1);
    if (e.key === "ArrowLeft") ir(-1);
  };

  const caja = h("div", { class: "lightbox", role: "dialog", "aria-modal": "true", "aria-label": "Evidencia ampliada" },
    h("button", { class: "lb-close", "aria-label": "Cerrar", onclick: cerrar }, I("close", 20)),
    lista.length > 1 ? h("button", { class: "lb-nav prev", "aria-label": "Anterior", onclick: () => ir(-1) }, I("arrow", 20)) : null,
    img,
    lista.length > 1 ? h("button", { class: "lb-nav next", "aria-label": "Siguiente", onclick: () => ir(1) }, I("arrow", 20)) : null,
    contadorEl
  );
  caja.addEventListener("click", e => { if (e.target === caja) cerrar(); });

  const previo = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  document.addEventListener("keydown", onKey);
  document.body.appendChild(caja);
}


/* ============================================================
   EDITOR DE PORTADA 16:9
   ------------------------------------------------------------
   El recorte se hace en el navegador sobre un canvas, de modo que
   lo que se sube ya tiene la proporción exacta 16:9 y un peso
   controlado. La imagen se almacena en Google Drive y su URL queda
   escrita en la columna "Imagen principal" de la hoja.
   ============================================================ */
function abrirEditorPortada(action, alGuardar) {
  const P = CONFIG.portada;
  let imagen = null;                 // HTMLImageElement cargado
  let archivo = null;
  const enc = { zoom: 1, ox: 0.5, oy: 0.5 };

  const lienzo = h("canvas", { class: "portada-canvas", width: 640, height: 360 });
  const ctx2d = lienzo.getContext("2d");
  const zonaVacia = h("div", { class: "portada-vacia" },
    I("image", 22),
    h("span", { text: "Selecciona o arrastra una imagen" }),
    h("small", { text: "JPG, PNG o WEBP · hasta " + P.maxArchivoMb + " MB" })
  );

  const entrada = h("input", {
    type: "file", accept: P.tiposAceptados.join(","), class: "portada-file", id: "portada-file",
    "aria-label": "Seleccionar imagen de portada"
  });

  const slZoom = h("input", { type: "range", min: "1", max: "3", step: "0.01", value: "1", "aria-label": "Acercamiento" });
  const slX = h("input", { type: "range", min: "0", max: "1", step: "0.01", value: "0.5", "aria-label": "Encuadre horizontal" });
  const slY = h("input", { type: "range", min: "0", max: "1", step: "0.01", value: "0.5", "aria-label": "Encuadre vertical" });
  const controles = h("div", { class: "portada-controles", hidden: "hidden" },
    h("label", {}, h("span", { class: "eyebrow", text: "Zoom" }), slZoom),
    h("label", {}, h("span", { class: "eyebrow", text: "Horizontal" }), slX),
    h("label", {}, h("span", { class: "eyebrow", text: "Vertical" }), slY)
  );

  const aviso = h("p", { class: "portada-aviso", role: "status", "data-tipo": "info" });
  const btnGuardar = h("button", { class: "btn", disabled: "disabled" }, "Guardar portada ", I("arrow", 15));

  /* ---- dibujado ---- */
  function pintar() {
    const W = lienzo.width, H = lienzo.height;
    ctx2d.clearRect(0, 0, W, H);
    if (!imagen) return;
    dibujarCubriendo(ctx2d, imagen, W, H, enc);
  }

  function dibujarCubriendo(c, img, W, H, e) {
    const escala = Math.max(W / img.naturalWidth, H / img.naturalHeight) * e.zoom;
    const dw = img.naturalWidth * escala;
    const dh = img.naturalHeight * escala;
    c.drawImage(img, (W - dw) * e.ox, (H - dh) * e.oy, dw, dh);
  }

  [[slZoom, "zoom"], [slX, "ox"], [slY, "oy"]].forEach(([sl, clave]) => {
    sl.addEventListener("input", () => { enc[clave] = parseFloat(sl.value); pintar(); });
  });

  /* ---- selección de archivo ---- */
  function tomarArchivo(f) {
    aviso.textContent = "";
    if (!f) return;
    if (P.tiposAceptados.indexOf(f.type) === -1) {
      aviso.textContent = "Formato no admitido. Usa JPG, PNG o WEBP.";
      return;
    }
    if (f.size > P.maxArchivoMb * 1024 * 1024) {
      aviso.textContent = `La imagen pesa ${(f.size / 1048576).toFixed(1)} MB y el máximo es ${P.maxArchivoMb} MB.`;
      return;
    }
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        imagen = img;
        archivo = f;
        enc.zoom = 1; enc.ox = 0.5; enc.oy = 0.5;
        slZoom.value = "1"; slX.value = "0.5"; slY.value = "0.5";
        zonaVacia.hidden = true;
        lienzo.hidden = false;
        controles.hidden = false;
        btnGuardar.removeAttribute("disabled");
        pintar();
      };
      img.onerror = () => { aviso.textContent = "No se pudo leer la imagen."; };
      img.src = lector.result;
    };
    lector.onerror = () => { aviso.textContent = "No se pudo leer el archivo."; };
    lector.readAsDataURL(f);
  }

  entrada.addEventListener("change", e => tomarArchivo(e.target.files && e.target.files[0]));

  const marco = h("div", { class: "portada-marco" }, zonaVacia, lienzo);
  lienzo.hidden = true;
  marco.addEventListener("dragover", e => { e.preventDefault(); marco.classList.add("sobre"); });
  marco.addEventListener("dragleave", () => marco.classList.remove("sobre"));
  marco.addEventListener("drop", e => {
    e.preventDefault();
    marco.classList.remove("sobre");
    tomarArchivo(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  marco.addEventListener("click", () => { entrada.click(); });

  /* ---- guardado ---- */
  btnGuardar.addEventListener("click", async () => {
    if (!imagen) { aviso.textContent = "Primero elige una imagen."; return; }

    const salida = document.createElement("canvas");
    salida.width = P.anchoSalida;
    salida.height = P.altoSalida;
    dibujarCubriendo(salida.getContext("2d"), imagen, salida.width, salida.height, enc);

    let dataUrl;
    try {
      dataUrl = salida.toDataURL("image/jpeg", P.calidadJpeg);
    } catch {
      aviso.textContent = "El navegador bloqueó el procesamiento de la imagen.";
      toast("No se pudo procesar la imagen en este navegador", "error");
      return;
    }
    const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);

    btnGuardar.disabled = true;
    btnGuardar.classList.add("cargando");
    aviso.dataset.tipo = "info";
    aviso.textContent = "Subiendo la imagen a Google Drive…";

    try {
      throw new Error("ONEDRIVE_PENDIENTE");
      const token = await asegurarToken();
      const res = await API.subirPortada({
        id: action.id,
        fila: action.fila,
        titulo: action.titulo,
        filename: nombreArchivo(action, archivo),
        mimeType: "image/jpeg",
        dataBase64: base64
      }, token);

      const url = (res && res.url) || "";
      if (!url) throw new Error("El servidor no devolvió la URL de la imagen.");

      action.imagen = url;
      action.galeria = [url].concat((action.galeria || []).filter(g => g !== url)).slice(0, CONFIG.datos.maxImagenesGaleria);

      cerrar();
      toast("Portada guardada en Drive y registrada en la hoja", "ok");
      if (typeof alGuardar === "function") alGuardar(action, url);
    } catch (err) {
      const codigo = (err && err.message) || "";
      let mensaje;
      if (codigo === "ONEDRIVE_PENDIENTE") {
        pintar("error", "conexión a OneDrive pendiente");
        toast("Conexión a OneDrive pendiente. Estos cambios no se han guardado.", "info");
      } else if (codigo === "SIN_TOKEN") {
        mensaje = "Se necesita el token de escritura. Ejecuta verToken() en Apps Script.";
      } else if (codigo === "UNAUTHORIZED") {
        API.olvidarTokenEscritura();
        mensaje = "El token no es válido. Vuelve a intentarlo e ingresa el token vigente.";
      } else if (codigo === "FILE_TOO_LARGE") {
        mensaje = "La imagen resultó demasiado pesada. Prueba con una foto más pequeña.";
      } else if (codigo === "NOT_FOUND" || codigo === "AMBIGUOUS") {
        mensaje = (err && err.detalle) || "No se pudo ubicar el registro en la hoja.";
      } else if (codigo === "TIMEOUT") {
        mensaje = "La subida tardó demasiado. Revisa tu conexión y reintenta.";
      } else {
        mensaje = (err && err.detalle) || codigo || "Error desconocido.";
      }
      aviso.dataset.tipo = "error";
      aviso.textContent = "No se pudo guardar: " + mensaje;
      toast("No se pudo guardar la portada", "error");
      btnGuardar.disabled = false;
      btnGuardar.classList.remove("cargando");
    }
  });

  /* ---- montaje ---- */
  const onKey = e => { if (e.key === "Escape") cerrar(); };
  function cerrar() {
    document.removeEventListener("keydown", onKey);
    document.body.style.overflow = previo;
    caja.remove();
  }

  const panel = h("div", { class: "portada-panel", role: "dialog", "aria-modal": "true", "aria-label": "Imagen de portada" },
    h("div", { class: "portada-head" },
      h("div", {},
        h("div", { class: "eyebrow", text: "Imagen de portada · 16:9" }),
        h("h3", { text: action.titulo })
      ),
      h("button", { class: "icon-btn", "aria-label": "Cerrar", onclick: () => cerrar() }, I("close", 18))
    ),
    marco,
    controles,
    h("div", { class: "portada-acciones" },
      h("label", { class: "campo campo-archivo", for: "portada-file" },
        h("span", { class: "eyebrow", text: "Archivo de imagen" }), entrada),
      btnGuardar
    ),
    aviso,
    h("p", { class: "portada-nota", text: "La imagen se recorta a 1600 × 900 px, se guarda en la carpeta de evidencias de Google Drive y su enlace queda escrito en la columna \"Imagen principal\" de la hoja." })
  );

  const caja = h("div", { class: "portada-overlay" }, panel);
  caja.addEventListener("click", e => { if (e.target === caja) cerrar(); });

  const previo = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  document.addEventListener("keydown", onKey);
  document.body.appendChild(caja);
  setTimeout(() => entrada.focus(), 30);   // el input es visible y enfocable
  return caja;
}

function nombreArchivo(action, f) {
  const base = String(action.id || "registro").replace(/[^A-Za-z0-9_-]/g, "");
  const sello = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "");
  return `portada_${base}_${sello}.jpg`;
}

/* ==================== módulo: capture.js ==================== */
const __M_capture = (function () {
/* ============================================================
   Brandg · Radar Competitivo — Captura de registros
   ------------------------------------------------------------
   Escritura hacia Google Sheets vía Apps Script.
   DESACTIVADO por defecto (CONFIG.captura.habilitada = false),
   porque el proyecto original declara que el único lugar de
   edición es Google Sheets.

   Seguridad: el token de escritura NO vive en el código. Se pide
   en pantalla y se guarda en sessionStorage (muere al cerrar la
   pestaña). Aun así, un token en el navegador es un secreto débil:
   ver la sección "Limitaciones" del README.
   ============================================================ */

const { CONFIG, COLUMNAS_COMERCIALES } = __M_config;
const { validarRegistro } = __M_validation;
const API = __M_api;
const { h, I, toast } = __M_ui;

const CAMPOS_LARGOS = new Set(["Descripción", "Insight", "Resumen", "Imágenes adicionales"]);

const tokenGuardado = () => API.tokenEscritura();
const guardarToken = t => API.guardarTokenEscritura(t);

/**
 * Monta el botón flotante + panel de captura.
 * @param {object} ctx  contexto de la app
 * @param {Function} alGuardar  callback para re-sincronizar
 */
function montarCaptura(ctx, alGuardar) {
  const panel = h("section", {
    class: "captura-panel", id: "captura", "aria-hidden": "true", "aria-label": "Registrar hallazgo"
  });

  const boton = h("button", {
    class: "fab-captura", "aria-controls": "captura", "aria-expanded": "false",
    title: "Registrar hallazgo",
    onclick: () => alternar()
  }, I("spark", 18, true), h("span", { text: "Registrar hallazgo" }));

  function alternar(forzar) {
    const abierto = forzar !== undefined ? forzar : panel.getAttribute("aria-hidden") === "true";
    panel.setAttribute("aria-hidden", String(!abierto));
    boton.setAttribute("aria-expanded", String(abierto));
    panel.classList.toggle("abierto", abierto);
    if (abierto) {
      pintarFormulario();
      const primero = panel.querySelector("input, textarea");
      if (primero) primero.focus();
    }
  }

  function pintarFormulario() {
    if (panel.dataset.listo === "1") return;
    panel.dataset.listo = "1";

    const campos = {};
    const errores = h("ul", { class: "captura-errores", role: "alert" });

    const grid = h("div", { class: "captura-grid" },
      ...COLUMNAS_COMERCIALES.map(nombre => {
        const id = "cap-" + nombre.replace(/\s+/g, "-").toLowerCase();
        const control = CAMPOS_LARGOS.has(nombre)
          ? h("textarea", { id, rows: nombre === "Descripción" ? 5 : 3, name: nombre })
          : h("input", { id, type: "text", name: nombre });
        campos[nombre] = control;
        return h("label", { class: "campo" + (CAMPOS_LARGOS.has(nombre) ? " ancho" : ""), for: id },
          h("span", { class: "eyebrow", text: nombre }), control);
      }),
      ...["Marca", "Grupo", "Fecha"].map(nombre => {
        const id = "cap-" + nombre.toLowerCase();
        const control = h("input", { id, type: nombre === "Fecha" ? "date" : "text", name: nombre });
        campos[nombre] = control;
        return h("label", { class: "campo", for: id },
          h("span", { class: "eyebrow", text: nombre }), control);
      })
    );

    const inputToken = h("input", {
      id: "cap-token", type: "password", autocomplete: "off",
      placeholder: "Token de escritura", value: tokenGuardado()
    });

    const btnGuardar = h("button", { class: "btn", type: "button" }, "Guardar en Google Sheets ", I("arrow", 15));

    btnGuardar.addEventListener("click", async () => {
      errores.textContent = "";
      const bruto = {};
      Object.entries(campos).forEach(([k, el]) => (bruto[k] = el.value));

      const { valido, errores: errs, limpio } = validarRegistro(bruto);
      if (!valido) {
        errs.forEach(e => errores.appendChild(h("li", { text: e.mensaje })));
        toast("Revisa los campos marcados", "error");
        return;
      }
      const token = inputToken.value.trim();
      if (!token) { toast("Falta el token de escritura", "error"); return; }

      btnGuardar.disabled = true;
      btnGuardar.classList.add("cargando");
      try {
        await API.crearRegistro(limpio, token);
        guardarToken(token);
        Object.entries(campos).forEach(([, el]) => (el.value = ""));
        toast("Registro creado en Google Sheets", "ok");
        alternar(false);
        if (typeof alGuardar === "function") alGuardar();
      } catch (err) {
        const detalle = (err && err.detalle) || (err && err.message) || "Error desconocido";
        (err && err.errores || []).forEach(d => errores.appendChild(h("li", { text: String(d) })));
        toast("No se pudo guardar: " + detalle, "error");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.classList.remove("cargando");
      }
    });

    panel.appendChild(h("div", { class: "captura-head" },
      h("h3", { text: "Registrar hallazgo" }),
      h("button", { class: "icon-btn", "aria-label": "Cerrar", onclick: () => alternar(false) }, I("close", 18))
    ));
    panel.appendChild(h("p", { class: "captura-nota", text: "Los campos obligatorios son Categoría, Tipo de acción, Título y Resumen. La fila se agrega al final de la hoja con estado Publicado." }));
    panel.appendChild(errores);
    panel.appendChild(grid);
    panel.appendChild(h("div", { class: "captura-pie" },
      h("label", { class: "campo", for: "cap-token" },
        h("span", { class: "eyebrow", text: "Token de escritura" }), inputToken),
      btnGuardar
    ));
  }

  return h("div", { class: "captura-wrap" }, boton, panel);
}

return { montarCaptura };
})();

/* ==================== módulo: app.js ==================== */
const __M_app = (function () {
/* ============================================================
   Brandg · Radar Competitivo — Orquestador
   ------------------------------------------------------------
   · Estado de la aplicación
   · Routing por hash (compatible con GitHub Pages, sin servidor)
   · Ciclo de vida: montar / desmontar / liberar animaciones
   ============================================================ */

const { CONFIG } = __M_config;
const API = __M_api;
const UI = __M_ui;
const Anim = __M_animations;
const { montarCaptura } = __M_capture;

const VISTAS = ["home", "explorer", "timeline", "insights", "compare"];

const estado = {
  view: "home",
  filtros: {},
  query: "",
  focusMonth: "",
  compareA: "",
  compareB: "",
  detalle: null,
  theme: "light",
  cargando: true,
  error: null
};

let V = null;
let radarActivo = null;
const limpiadores = [];

const root = () => document.getElementById("root");
const log = (...a) => { if (CONFIG.dev.logs) console.log("[app]", ...a); };

/* ============================================================
   Tema
   ============================================================ */
function aplicarTema(t) {
  estado.theme = t;
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("vigia-theme", t); } catch { /* modo privado */ }
}

function temaInicial() {
  try {
    const guardado = localStorage.getItem("vigia-theme");
    if (guardado === "dark" || guardado === "light") return guardado;
  } catch { /* noop */ }
  return matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

/* ============================================================
   Routing por hash:  #/vista?param=valor   ·   #/accion/ID
   ============================================================ */
function leerHash() {
  const bruto = (location.hash || "").replace(/^#\/?/, "");
  const [ruta, qs] = bruto.split("?");
  const partes = ruta.split("/").filter(Boolean);
  const params = new URLSearchParams(qs || "");
  return { partes, params };
}

function aplicarHash() {
  const { partes, params } = leerHash();
  const primero = partes[0] || "home";

  if (primero === "accion" && partes[1]) {
    const encontrada = V && V.actions.find(a => String(a.id) === decodeURIComponent(partes[1]));
    if (encontrada) {
      estado.detalle = encontrada;
      if (!vistaPintada) render(); else renderDetalle();
      return;
    }
  }

  estado.detalle = null;
  cerrarDetalle();

  estado.view = VISTAS.includes(primero) ? primero : "home";
  estado.filtros = {};
  ["marca", "categoria", "tipo", "canal", "mes"].forEach(k => {
    const v = params.get(k);
    if (v) estado.filtros[k] = v;
  });
  estado.query = params.get("q") || "";
  if (partes[0] === "timeline" && partes[1]) estado.focusMonth = partes[1];

  render();
}

function navegar(vista, filtros) {
  const qs = new URLSearchParams();
  Object.entries(filtros || {}).forEach(([k, v]) => { if (v) qs.set(k, v); });
  const cola = qs.toString();
  const nuevo = `#/${vista}${cola ? "?" + cola : ""}`;
  if (location.hash === nuevo) { aplicarHash(); return; }
  location.hash = nuevo;
}

/* ============================================================
   Contexto que reciben las vistas
   ============================================================ */
const ctx = {
  get view() { return estado.view; },
  get theme() { return estado.theme; },
  get origen() { return API.estadoFuente.origen; },
  get filtros() { return estado.filtros; },
  get query() { return estado.query; },
  get focusMonth() { return estado.focusMonth || (V && V.currentMonth) || ""; },
  get compareA() { return estado.compareA; },
  get compareB() { return estado.compareB; },

  go: (vista, filtros) => navegar(vista, filtros),
  onOpen: accion => { estado.detalle = accion; location.hash = `#/accion/${encodeURIComponent(accion.id)}`; },
  onClose: () => { history.back(); },
  onPortada: (accion, tarjeta) => UI.abrirEditorPortada(accion, () => {
    if (!tarjeta) return;
    const posterViejo = tarjeta.querySelector(".poster");
    if (posterViejo) posterViejo.replaceWith(UI.Poster(accion));
    const etiqueta = tarjeta.querySelector(".btn-portada span");
    if (etiqueta) etiqueta.textContent = "Cambiar portada";
    Anim.pulsoDeteccion(tarjeta);
  }),
  toggleTheme: () => { aplicarTema(estado.theme === "dark" ? "light" : "dark"); renderChrome(); },
  sincronizar: () => sincronizar(true),
  setFiltros: (f, q) => { estado.filtros = { ...f }; estado.query = q; },
  setFocusMonth: mes => { estado.focusMonth = mes; render(); },
  setCompare: (a, b) => { estado.compareA = a; estado.compareB = b; },
  registrarRadar: r => { radarActivo = r; },
  alSalir: fn => limpiadores.push(fn)
};

/* ============================================================
   Render
   ============================================================ */
function liberarVista() {
  limpiadores.splice(0).forEach(fn => { try { fn(); } catch { /* noop */ } });
  Anim.destruirTodo();
  radarActivo = null;
}

function renderChrome() {
  const cont = root();
  const navVieja = cont.querySelector(".nav");
  const nueva = UI.Nav(ctx);
  if (navVieja) navVieja.replaceWith(nueva);
  else cont.prepend(nueva);
}

let vistaPintada = false;   // true cuando la vista principal ya se dibujó con datos
function render() {
  const cont = root();
  if (!cont) return;
  vistaPintada = !estado.cargando && !estado.error;
  liberarVista();
  cont.textContent = "";

  const app = UI.h("div", { class: "app" });
  app.appendChild(UI.Nav(ctx));

  const main = UI.h("main", { id: "main", tabindex: "-1" });
  app.appendChild(main);

  if (estado.cargando) {
    main.appendChild(UI.EstadoCarga("Escaneando el mercado…"));
  } else if (estado.error) {
    main.appendChild(UI.EstadoError(estado.error, () => sincronizar(true)));
  } else {
    let vista;
    switch (estado.view) {
      case "explorer": vista = UI.Explorer(ctx); break;
      case "timeline": vista = UI.Timeline(ctx); break;
      case "insights": vista = UI.Insights(ctx); break;
      case "compare":  vista = UI.Compare(ctx); break;
      default:         vista = UI.Home(ctx);
    }
    main.appendChild(vista);
    Anim.transicionVista(vista);
    app.appendChild(UI.Footer());
    if (CONFIG.captura.habilitada) app.appendChild(montarCaptura(ctx, () => sincronizar(true)));
  }

  cont.appendChild(app);

  if (estado.detalle) renderDetalle();
  window.scrollTo({ top: 0, behavior: Anim.movimientoActivo() ? "smooth" : "auto" });
}

let overlayDetalle = null;
function renderDetalle() {
  if (!estado.detalle || !V) return;
  cerrarDetalle();
  overlayDetalle = UI.Detail(estado.detalle, ctx);
  document.body.appendChild(overlayDetalle);
  document.body.style.overflow = "hidden";
  const onKey = e => { if (e.key === "Escape") ctx.onClose(); };
  document.addEventListener("keydown", onKey);
  overlayDetalle.__onKey = onKey;
  const cerrar = overlayDetalle.querySelector(".detail-close");
  if (cerrar) cerrar.focus();
}

function cerrarDetalle() {
  if (!overlayDetalle) return;
  document.removeEventListener("keydown", overlayDetalle.__onKey);
  overlayDetalle.remove();
  overlayDetalle = null;
  document.body.style.overflow = "";
}

/* ============================================================
   Carga y sincronización
   ============================================================ */
let syncSeq = 0;
async function sincronizar(forzar) {
  const miSync = ++syncSeq;
  estado.cargando = true;
  estado.error = null;
  Anim.barridoSync(true);
  render();

  try {
    if (forzar) API.invalidarCache();
    const ds = await API.cargarDataset({ forzar: !!forzar });
    if (miSync !== syncSeq) return;          // llegó una sincronización más reciente
    V = ds;
    UI.setDataset(V);
    if (!estado.focusMonth) estado.focusMonth = V.currentMonth;
    if (!estado.compareB && V.months.length >= 2) {
      estado.compareA = V.months[V.months.length - 2].key;
      estado.compareB = V.months[V.months.length - 1].key;
    }
    estado.cargando = false;
    aplicarHash();
    API.cargarCapacidades();
    if (radarActivo) radarActivo.emitirOnda();
    if (forzar) {
      UI.toast(`Demo · ${V.actions.length} registros ficticios`, "ok");
    }
  } catch (err) {
    if (miSync !== syncSeq) return;
    console.error("[app] carga fallida", err);
    estado.cargando = false;
    estado.error = mensajeError(err);
    render();
  } finally {
    if (miSync === syncSeq) Anim.barridoSync(false);
  }
}

function mensajeError(err) {
  const c = (err && err.message) || "";
  if (c === "TIMEOUT") return "El servidor tardó demasiado en responder. Revisa tu conexión y reintenta.";
  if (c === "API_NO_CONFIGURADA") return "Falta configurar CONFIG.api.url en js/config.js con la URL .../exec del Web App.";
  if (c === "HOJA_VACIA") return "La hoja no tiene filas de datos debajo de los encabezados.";
  if (/HTTP 40|HTTP 50/.test(c)) return `El Web App respondió ${c}. Verifica que esté desplegado con acceso "Cualquier persona".`;
  if (c === "RESPUESTA_INVALIDA") return "El Web App no devolvió JSON. Verifica que esté desplegado con acceso \"Cualquier persona\" y reintenta.";
  if (c === "SHEET_NOT_FOUND") return "No existe la hoja indicada. Revisa la propiedad SHEET_NAME del Apps Script.";
  return "Verifica la URL del Web App de Apps Script y que la hoja esté publicada.";
}

/* ============================================================
   Arranque
   ============================================================ */
function iniciar() {
  aplicarTema(temaInicial());
  Anim.init();
  window.addEventListener("hashchange", aplicarHash);
  window.addEventListener("beforeunload", () => { liberarVista(); });
  sincronizar(false);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", iniciar);
} else {
  iniciar();
}

/* Punto de entrada expuesto solo para diagnóstico manual en consola */
if (CONFIG.dev.logs) {
  window.__radar = { estado, get dataset() { return V; }, sincronizar, API, Anim };
}

return {  };
})();

})();
  </script>
