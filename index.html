/* ============================================================
   Brandg — Radar Competitivo
   Design tokens + global styles  (blue → teal gradient system)
   ============================================================ */

:root {
  /* Type */
  --sans: "DM Sans", system-ui, sans-serif;
  --serif: "Playfair Display", Georgia, serif;
  --mono: "DM Mono", ui-monospace, monospace;

  /* Light theme — cool ink on near-white, inspired by the Brandg logo */
  --paper:        #FAFAF8;
  --paper-2:      #F2F2EF;
  --paper-3:      #E8E8E4;
  --card:         #FFFFFF;
  --ink:          #1E1E24;   /* logo charcoal-blue */
  --ink-2:        #4A4A55;
  --ink-3:        #8A8A96;
  --line:         #E4E4E0;
  --line-2:       #D0D0CB;

  /* Brand colors + gradient + relevance scale */
  --blue:         #1E1E24;
  --teal:         #00BDB5;  /* logo “g” turquoise */
  --signal:       #00BDB5;
  --signal-soft:  #E0F7F6;
  --grad:         linear-gradient(118deg, #009991 0%, #00BDB5 50%, #33CFC8 100%);
  --grad-soft:    linear-gradient(118deg, #E0F7F6 0%, #F0FFFE 100%);
  --rel-alto:     #1E1E24;
  --rel-medio:    oklch(0.70 0.115 198);
  --rel-bajo:     oklch(0.66 0.025 245);

  --shadow-sm: 0 1px 2px oklch(0.26 0.02 264 / 0.06), 0 1px 1px oklch(0.26 0.02 264 / 0.04);
  --shadow-md: 0 4px 14px oklch(0.26 0.02 264 / 0.08), 0 1px 3px oklch(0.26 0.02 264 / 0.05);
  --shadow-lg: 0 18px 50px oklch(0.30 0.04 260 / 0.16), 0 4px 14px oklch(0.30 0.04 260 / 0.08);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 30px;

  --max: 1320px;
  --nav-h: 64px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --paper:        oklch(0.185 0.018 262);
  --paper-2:      oklch(0.215 0.020 262);
  --paper-3:      oklch(0.245 0.022 262);
  --card:         oklch(0.228 0.021 262);
  --ink:          oklch(0.96 0.006 230);
  --ink-2:        oklch(0.78 0.012 235);
  --ink-3:        oklch(0.62 0.016 240);
  --line:         oklch(0.32 0.022 262);
  --line-2:       oklch(0.40 0.026 262);
  --blue:         oklch(0.64 0.15 250);
  --teal:         oklch(0.78 0.11 192);
  --signal:       oklch(0.70 0.135 232);
  --signal-soft:  oklch(0.32 0.07 240);
  --grad:         linear-gradient(118deg, oklch(0.58 0.17 262), oklch(0.68 0.15 220) 48%, oklch(0.80 0.12 190));
  --grad-soft:    linear-gradient(118deg, oklch(0.34 0.08 250), oklch(0.36 0.07 196));
  --rel-alto:     oklch(0.66 0.15 250);
  --rel-medio:    oklch(0.76 0.11 195);
  --rel-bajo:     oklch(0.60 0.02 250);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-md: 0 6px 20px oklch(0 0 0 / 0.35);
  --shadow-lg: 0 24px 60px oklch(0 0 0 / 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.5;
}

::selection { background: var(--signal); color: #fff; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
input { font-family: inherit; }

.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.shell { max-width: var(--max); margin: 0 auto; padding: 0 40px; }
@media (max-width: 760px) { .shell { padding: 0 20px; } }

/* ---------- App scaffold ---------- */
#root { min-height: 100vh; }

.app { min-height: 100vh; padding-top: var(--nav-h); }

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
  z-index: 100;
  display: flex; align-items: center;
  background: color-mix(in oklch, var(--paper) 80%, transparent);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 2px solid transparent; background-image: linear-gradient(var(--paper), var(--paper)), linear-gradient(90deg, var(--line), var(--teal) 50%, var(--line)); background-origin: border-box; background-clip: padding-box, border-box;
}
.nav .shell { display: flex; align-items: center; gap: 28px; width: 100%; }

.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--grad); color: #fff;
  display: grid; place-items: center;
  position: relative; overflow: hidden;
  flex-shrink: 0; box-shadow: 0 2px 10px oklch(0.5 0.15 240 / 0.35);
}
.brand-mark::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, oklch(1 0 0 / 0.35) 0%, transparent 55%);
}
.brand-mark span { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px oklch(1 0 0 / 0.25); }
.brand-name { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; line-height: 1; }
.brand-name em { font-style: normal; background: linear-gradient(120deg, var(--blue), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-name sup { font-size: 8px; font-weight: 600; color: var(--ink-3); vertical-align: super; margin-left: 1px; }
.brand-sub { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); letter-spacing: 0.14em; margin-top: 2px; }

.nav-links { display: flex; align-items: center; gap: 2px; margin-left: 8px; }
.nav-link {
  font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  padding: 8px 13px; border-radius: 9px; position: relative;
  transition: color 0.2s, background 0.2s;
}
.nav-link:hover { color: var(--ink); background: var(--paper-2); }
.nav-link.active { color: #00BDB5; font-weight: 700; }
.nav-link.active::after {
  content: ""; position: absolute; left: 13px; right: 13px; bottom: -1px; height: 2px;
  background: var(--signal); border-radius: 2px;
}

.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-2); transition: background 0.2s, color 0.2s; border: 1px solid transparent;
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); border-color: var(--line); }

.month-pill {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em;
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-2);
  color: var(--ink-2); background: var(--card);
}
.month-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rel-alto); box-shadow: 0 0 0 3px var(--signal-soft); }

@media (max-width: 880px) { .nav-links { display: none; } }

/* ============================================================
   View transitions
   ============================================================ */
/* Entrance: transform-only so content stays visible even if the
   browser pauses animations (backgrounded iframe / screenshots). */
.view { animation: viewIn 0.55s var(--ease) both; }
@keyframes viewIn {
  from { transform: translateY(12px); }
  to   { transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

.section-pad { padding: 80px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
.section-title { font-family: var(--serif); font-size: clamp(30px, 4vw, 46px); font-weight: 400; line-height: 1.02; letter-spacing: -0.01em; }
.section-desc { color: var(--ink-2); max-width: 50ch; font-size: 15px; }

/* ============================================================
   Badges / chips
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 6px;
  border: 1px solid var(--line-2); color: var(--ink-2); background: var(--card);
  white-space: nowrap;
}
.rel {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
  font-weight: 700;
}
.rel .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 11px; }
.rel .bars i { width: 3px; border-radius: 1px; background: var(--ink-3); opacity: 0.28; }
.rel .bars i:nth-child(1) { height: 5px; }
.rel .bars i:nth-child(2) { height: 8px; }
.rel .bars i:nth-child(3) { height: 11px; }
.rel[data-r="Alto"]  { color: var(--rel-alto); }
.rel[data-r="Medio"] { color: var(--rel-medio); }
.rel[data-r="Bajo"]  { color: var(--rel-bajo); }
.rel[data-r="Alto"]  .bars i { background: var(--rel-alto);  opacity: 1; }
.rel[data-r="Medio"] .bars i:nth-child(-n+2) { background: var(--rel-medio); opacity: 1; }
.rel[data-r="Bajo"]  .bars i:nth-child(1) { background: var(--rel-bajo); opacity: 1; }

/* ============================================================
   Image placeholders (generative poster per action)
   ============================================================ */
.poster {
  position: relative; overflow: hidden; border-radius: var(--r-md);
  background: var(--paper-3); isolation: isolate;
}
.poster-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; display: block;
}
.poster[data-has-img] .mono-tag {
  background: linear-gradient(transparent, oklch(0.15 0.03 255 / 0.55));
  padding: 22px 12px 10px; left: 0; right: 0; bottom: 0; margin: 0;
}
.poster[data-has-img]::after { display: none; }
.poster .wash { position: absolute; inset: 0;
  background: linear-gradient(var(--ang, 120deg), var(--c1, oklch(0.4 0.16 255)), var(--c2, oklch(0.8 0.1 192)));
}
.poster .stripes {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(135deg,
    oklch(1 0 0 / 0.10) 0 2px, transparent 2px 13px);
  opacity: 0.6;
}
.poster::after { /* soft top sheen */
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: radial-gradient(120% 80% at 78% 0%, oklch(1 0 0 / 0.22) 0%, transparent 55%);
}
.poster .mono-tag {
  position: absolute; left: 14px; bottom: 12px; right: 14px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em;
  color: oklch(1 0 0 / 0.82); display: flex; align-items: center; gap: 6px; z-index: 2;
}
.poster .mono-tag svg { width: 12px; height: 12px; opacity: 0.7; flex-shrink: 0; }
.poster .monogram {
  position: absolute; z-index: 2; inset: 0; display: grid; place-items: center;
  font-family: var(--serif); font-style: italic;
  color: oklch(1 0 0 / 0.94); line-height: 0.8;
  text-shadow: 0 2px 30px oklch(0.2 0.05 250 / 0.3);
}

/* ============================================================
   Cards — Explorer grid
   ============================================================ */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  overflow: hidden; cursor: pointer; position: relative;
  transition: transform 0.42s var(--ease), box-shadow 0.42s var(--ease), border-color 0.42s var(--ease);
}
.card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--line-2); }
.card .poster { border-radius: 0; aspect-ratio: 16/10; }
.card-body { padding: 18px 19px 20px; }
.card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 11px; }
.card-brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; }
.card-brand .swatch { width: 9px; height: 9px; border-radius: 3px; }
.card-title { font-family: var(--serif); font-size: 23px; line-height: 1.08; letter-spacing: -0.01em; margin-bottom: 7px; }
.card-resumen { font-size: 13.5px; color: var(--ink-2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; }
.card-date { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

.grid {
  display: grid; gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 11px;
  background: var(--grad); color: #fff; background-size: 140% 140%; background-position: 0% 50%;
  transition: transform 0.2s var(--ease), background-position 0.5s var(--ease), opacity 0.2s;
  box-shadow: 0 4px 16px oklch(0.5 0.15 240 / 0.28);
}
.btn:hover { transform: translateY(-2px); background-position: 100% 50%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); box-shadow: none; }
.btn.ghost:hover { background: var(--paper-2); }

/* ============================================================
   FILTER BAR
   ============================================================ */
.filterbar { position: sticky; top: var(--nav-h); z-index: 40;
  background: color-mix(in oklch, var(--paper) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 2px solid transparent; background-image: linear-gradient(var(--paper), var(--paper)), linear-gradient(90deg, var(--line), var(--teal) 50%, var(--line)); background-origin: border-box; background-clip: padding-box, border-box; padding: 16px 0;
}
.search {
  display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 12px;
  padding: 0 14px; height: 44px; transition: border-color 0.2s, box-shadow 0.2s;
}
.search:focus-within { border-color: var(--signal); box-shadow: 0 0 0 4px var(--signal-soft); }
.search svg { width: 17px; height: 17px; color: var(--ink-3); flex-shrink: 0; }
.search input { border: none; outline: none; background: none; flex: 1; font-size: 14.5px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 2px 6px; }

.filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.select-wrap { position: relative; }
.fselect {
  appearance: none; -webkit-appearance: none;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 10px;
  height: 44px; padding: 0 34px 0 14px; font-size: 13.5px; color: var(--ink-2); font-weight: 500;
  cursor: pointer; transition: border-color 0.2s, color 0.2s;
}
.fselect:hover { border-color: var(--line-2); color: var(--ink); }
.fselect.set { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.select-wrap::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px;
  border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3);
  transform: translateY(-65%) rotate(45deg); pointer-events: none;
}
.result-count { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }
.clear-btn { font-size: 12.5px; color: var(--signal); font-weight: 600; padding: 8px 10px; border-radius: 8px; }
.clear-btn:hover { background: var(--signal-soft); }

/* ============================================================
   DETAIL view (article-like)
   ============================================================ */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200; overflow-y: auto;
  background: color-mix(in oklch, var(--paper) 60%, oklch(0.2 0.01 60 / 0.5));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  animation: fade 0.3s var(--ease) both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.detail-sheet {
  max-width: 1080px; margin: 48px auto; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: sheetIn 0.5s var(--ease) both;
}
@keyframes sheetIn { from { opacity: 0; transform: translateY(26px) scale(0.985); } to { opacity: 1; transform: none; } }
.detail-hero { position: relative; aspect-ratio: 21/9; }
.detail-hero .poster { border-radius: 0; height: 100%; }
.detail-close {
  position: fixed; top: 24px; right: 28px; z-index: 210;
  width: 44px; height: 44px; border-radius: 50%; background: var(--card);
  border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink);
  box-shadow: var(--shadow-md); transition: transform 0.2s;
}
.detail-close:hover { transform: rotate(90deg); }
.detail-pad { padding: 40px 56px 56px; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
.detail-title { font-family: var(--serif); font-size: clamp(34px, 5vw, 58px); line-height: 1.0; letter-spacing: -0.015em; margin-bottom: 14px; }
.detail-lede { font-size: 19px; color: var(--ink-2); line-height: 1.45; max-width: 60ch; margin-bottom: 34px; }
.detail-body { font-size: 16.5px; line-height: 1.72; color: var(--ink); max-width: 64ch; }
.detail-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 48px; margin-top: 8px; }
@media (max-width: 820px) { .detail-grid { grid-template-columns: 1fr; gap: 30px; } .detail-pad { padding: 30px 24px 40px; } }

.specs { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.spec { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 14px 0; border-bottom: 2px solid transparent; background-image: linear-gradient(var(--card), var(--card)), linear-gradient(90deg, var(--line), var(--teal) 50%, var(--line)); background-origin: border-box; background-clip: padding-box, border-box; }
.spec dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding-top: 2px; }
.spec dd { font-size: 14.5px; color: var(--ink); }
.spec dd .chips { display: flex; flex-wrap: wrap; gap: 6px; }

.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; }
.gallery .poster { aspect-ratio: 4/5; cursor: zoom-in; }
.gallery .poster:first-child { grid-column: span 3; aspect-ratio: 16/9; }

.related { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--line); }
.related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 760px) { .related-grid { grid-template-columns: 1fr; } }

/* ============================================================
   HOME
   ============================================================ */
.hero { padding: 72px 0 64px; position: relative; }
.hero::before {
  content: ""; position: absolute; right: -4%; top: -12%;
  width: min(560px, 50vw); aspect-ratio: 1; border-radius: 50%;
  background: var(--grad); filter: blur(70px); opacity: 0.28;
  z-index: 0; pointer-events: none;
}
.hero::after {
  content: ""; position: absolute; left: -8%; bottom: -20%;
  width: min(400px, 35vw); aspect-ratio: 1; border-radius: 50%;
  background: linear-gradient(135deg, #00BDB5, #33CFC8);
  filter: blur(100px); opacity: 0.15;
  z-index: 0; pointer-events: none;
}
.hero .hero-grid, .hero .hero-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: end; }
@media (max-width: 920px) { .hero-grid { grid-template-columns: 1fr; gap: 36px; } }
.hero h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(44px, 7.5vw, 96px); line-height: 0.95; letter-spacing: -0.03em; }
.hero h1 em { font-style: italic; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-lede { font-size: 18px; color: var(--ink-2); max-width: 44ch; margin-top: 26px; line-height: 1.5; }

.kpi-stack { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; position: relative; }
.kpi { background: var(--card); padding: 22px 24px; transition: background 0.3s; }
.kpi:hover { background: var(--paper-2); }
.kpi-num { font-family: var(--serif); font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: #00BDB5; font-weight: 800; }
.kpi-num .small { font-size: 22px; color: var(--ink-3); }
.kpi-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
.kpi-delta { font-size: 12px; font-weight: 600; }
.kpi-delta.up { color: var(--rel-alto); }

.home-section { border-top: 2px solid transparent; background-image: linear-gradient(var(--paper), var(--paper)), linear-gradient(90deg, var(--teal), var(--line) 40%); background-origin: border-box; background-clip: padding-box, border-box; padding: 72px 0; }

.brand-rail { display: flex; flex-wrap: wrap; gap: 10px; }
.brand-tab {
  display: flex; align-items: center; gap: 9px; padding: 10px 15px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--card); font-size: 13.5px; font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
}
.brand-tab:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.brand-tab .swatch { width: 11px; height: 11px; border-radius: 4px; box-shadow: 0 0 6px rgba(0,189,181,0.3); }
.brand-tab .count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

.exec-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 820px) { .exec-grid { grid-template-columns: 1fr; } }
.exec-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 26px; transition: transform 0.3s var(--ease), box-shadow 0.3s; }
.exec-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,189,181,0.15), 0 2px 8px rgba(0,0,0,0.06); }
.exec-card .n { font-family: var(--mono); font-size: 11px; color: #00BDB5; font-weight: 700; letter-spacing: 0.08em; }
.exec-card h4 { font-family: var(--serif); font-size: 22px; line-height: 1.12; margin: 12px 0 10px; font-weight: 700; }
.exec-card p { font-size: 14px; color: var(--ink-2); line-height: 1.55; }

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline { position: relative; padding: 20px 0; }
.tl-track { display: flex; gap: 0; position: relative; }
.tl-month {
  flex: 1; text-align: center; position: relative; padding-top: 40px; cursor: pointer;
}
.tl-line { position: absolute; top: 12px; left: 0; right: 0; height: 2px; background: var(--line-2); }
.tl-node { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2px solid var(--line-2); transition: all 0.3s var(--ease); z-index: 2; }
.tl-month:hover .tl-node, .tl-month.active .tl-node { border-color: var(--signal); background: var(--signal); box-shadow: 0 0 0 5px var(--signal-soft); transform: translateX(-50%) scale(1.15); }
.tl-name { font-family: var(--serif); font-size: 28px; transition: color 0.3s; }
.tl-month.active .tl-name { color: var(--signal); }
.tl-count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 4px; }

/* ============================================================
   INSIGHTS
   ============================================================ */
.insight-feature { background: var(--ink); color: var(--paper); border-radius: var(--r-xl); padding: 48px; position: relative; overflow: hidden; }
.insight-feature::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 82% 28%, #33CFC8 0%, transparent 42%), radial-gradient(circle at 96% 88%, #009991 0%, transparent 40%), radial-gradient(circle at 12% 92%, #00BDB5 0%, transparent 34%);
  opacity: 0.42; }
.insight-feature .eyebrow { color: color-mix(in oklch, var(--paper) 65%, transparent); }
.insight-feature h3 { font-family: var(--serif); font-size: clamp(28px, 4vw, 44px); line-height: 1.08; margin: 16px 0; position: relative; max-width: 22ch; }
.insight-feature p { color: color-mix(in oklch, var(--paper) 78%, transparent); max-width: 52ch; position: relative; font-size: 15px; }

.rank-list { display: flex; flex-direction: column; }
.rank-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 2px solid transparent; background-image: linear-gradient(var(--card), var(--card)), linear-gradient(90deg, var(--line), var(--teal) 50%, var(--line)); background-origin: border-box; background-clip: padding-box, border-box; }
.rank-row:last-child { border-bottom: none; }
.rank-n { font-family: var(--serif); font-size: 28px; color: var(--ink-3); }
.rank-bar-wrap { display: flex; align-items: center; gap: 12px; }
.rank-name { font-weight: 600; font-size: 15px; min-width: 120px; }
.rank-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-3); overflow: hidden; }
.rank-bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--signal); transform-origin: left; }
.rank-val { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

.insight-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
@media (max-width: 820px) { .insight-cards { grid-template-columns: 1fr; } }

/* ============================================================
   COMPARADOR
   ============================================================ */
.cmp-selectors { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 40px; }
.cmp-vs { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--ink-3); }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 760px) { .cmp-grid { grid-template-columns: 1fr; } }
.cmp-col { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; }
.cmp-col h4 { font-family: var(--serif); font-size: 30px; margin-bottom: 4px; }
.cmp-col .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 22px; }
.cmp-stat { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); }
.cmp-stat .k { font-size: 13.5px; color: var(--ink-2); }
.cmp-stat .v { font-family: var(--serif); font-size: 30px; }
.cmp-delta-row { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 22px; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 24px; }
.cmp-delta-big { font-family: var(--serif); font-size: 46px; line-height: 1; }
.cmp-delta-big.up { color: var(--rel-alto); }
.cmp-delta-big.down { color: var(--ink-3); }

.empty { text-align: center; padding: 80px 20px; color: var(--ink-3); }
.empty .serif { font-size: 28px; color: var(--ink-2); margin-bottom: 8px; }

.footer { border-top: 1px solid var(--line); padding: 40px 0 60px; margin-top: 40px; color: var(--ink-3); font-size: 13px; }
.footer .shell { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; }

/* utility — transform-only entrance, opacity stays 1 */
.fade-up { animation: viewIn 0.6s var(--ease) both; }
.stagger > * { animation: stagIn 0.55s var(--ease) both; }
@keyframes stagIn {
  from { transform: translateY(16px); }
  to   { transform: translateY(0); }
}

/* ============================================================
   ============================================================
   MODERNIZACIÓN — Radar competitivo
   Todo lo que sigue es aditivo. No reemplaza tokens ni
   componentes del sistema visual original.
   ============================================================
   ============================================================ */

/* ---------- Logo oficial Brandg ---------- */
.brand-logo { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
.brand-logo img { height: 30px; width: auto; display: block; }
.brand-logo .logo-oscuro { display: none; }
[data-theme="dark"] .brand-logo .logo-claro { display: none; }
[data-theme="dark"] .brand-logo .logo-oscuro { display: block; }
.brand-logo .brand-sub { margin-top: 1px; }
@media (max-width: 560px) {
  .brand-logo img { height: 26px; }
  .brand-logo .brand-sub { display: none; }
}

/* ============================================================
   ENTRADA ESCALONADA (controlada por animations.js)
   ============================================================ */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .55s var(--ease), transform .55s var(--ease); }
.reveal.is-in { opacity: 1; transform: none; }
.view-in { opacity: 0; transform: translateY(10px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
.view-in.is-in { opacity: 1; transform: none; }

/* ============================================================
   PULSO DE DETECCIÓN — registros nuevos
   ============================================================ */
.card { position: relative; }
.card.es-nuevo { border-color: color-mix(in oklch, var(--teal) 45%, var(--line)); }
.chip-nuevo {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  padding: 4px 8px; border-radius: 999px;
  background: var(--teal); color: #fff; font-weight: 700;
  box-shadow: 0 0 0 0 color-mix(in oklch, var(--teal) 60%, transparent);
  animation: latido 2.6s var(--ease) infinite;
}
@keyframes latido {
  0%, 70%, 100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--teal) 55%, transparent); }
  35%           { box-shadow: 0 0 0 9px color-mix(in oklch, var(--teal) 0%, transparent); }
}
.pulso-deteccion { animation: pulsoDet 1.1s var(--ease) var(--pulsos, 2); }
@keyframes pulsoDet {
  0%   { box-shadow: 0 0 0 0 color-mix(in oklch, var(--teal) 45%, transparent); }
  100% { box-shadow: 0 0 0 16px color-mix(in oklch, var(--teal) 0%, transparent); }
}

/* ============================================================
   BARRIDO DE SINCRONIZACIÓN (overlay global)
   ============================================================ */
.sync-sweep {
  position: fixed; inset: 0; z-index: 300; pointer-events: none;
  background: linear-gradient(180deg,
    transparent 0%,
    color-mix(in oklch, var(--teal) 16%, transparent) 48%,
    color-mix(in oklch, var(--teal) 3%, transparent) 52%,
    transparent 100%);
  background-size: 100% 46%;
  background-repeat: no-repeat;
  animation: barrido 1.5s linear infinite;
  transition: opacity .4s ease;
}
.sync-sweep.out { opacity: 0; }
@keyframes barrido {
  from { background-position: 0 -50%; }
  to   { background-position: 0 150%; }
}

/* ---------- Escaneo de la grilla al filtrar ---------- */
.escaneando { position: relative; }
.escaneando::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: linear-gradient(180deg, transparent, color-mix(in oklch, var(--teal) 22%, transparent), transparent);
  background-size: 100% 26%; background-repeat: no-repeat;
  animation: barrido .65s var(--ease) 1;
}

/* ============================================================
   ESTADOS: carga, esqueleto, error, banner
   ============================================================ */
.estado-carga { padding: 80px 40px 100px; max-width: var(--max); margin: 0 auto; text-align: center; }
.estado-carga .eyebrow { margin-top: 18px; display: block; }
.radar-loader { width: 168px; height: 168px; margin: 0 auto; }
.radar-loader-canvas { width: 100%; height: 100%; display: block; }

.skeleton-grid {
  display: grid; gap: 22px; margin-top: 46px;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
}
.skeleton-card {
  height: 320px; border-radius: var(--r-lg);
  border: 1px solid var(--line); background: var(--card);
  position: relative; overflow: hidden;
}
.skeleton-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, color-mix(in oklch, var(--teal) 9%, transparent) 50%, transparent 80%);
  transform: translateX(-100%);
  animation: shimmer 1.5s linear infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

@keyframes latidoPunto { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.month-pill .dot.vivo { animation: latidoPunto 2.6s ease-in-out infinite; }

/* ============================================================
   IMÁGENES
   ============================================================ */
.poster-img { opacity: 0; transition: opacity .5s var(--ease); }
.poster-img.cargada { opacity: 1; }
.poster-err {
  position: absolute; z-index: 3; left: 0; right: 0; bottom: 0;
  padding: 8px 12px; font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: oklch(1 0 0 / 0.75); background: oklch(0.2 0.02 255 / 0.45);
}
.gallery-vacia {
  margin-top: 30px; display: flex; align-items: center; gap: 10px;
  padding: 20px 22px; border: 1px dashed var(--line-2); border-radius: var(--r-md);
  color: var(--ink-3); font-family: var(--mono); font-size: 11.5px;
  letter-spacing: 0.06em; text-transform: uppercase;
}

/* ---------- Lightbox de evidencias ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 400; display: grid; place-items: center;
  background: oklch(0.14 0.02 255 / 0.86);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade .28s var(--ease) both; padding: 40px 20px;
}
.lb-img { max-width: min(1100px, 92vw); max-height: 84vh; border-radius: var(--r-md); box-shadow: var(--shadow-lg); }
.lb-close, .lb-nav {
  position: absolute; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: oklch(1 0 0 / 0.12); border: 1px solid oklch(1 0 0 / 0.22);
  transition: background .2s, transform .2s;
}
.lb-close:hover, .lb-nav:hover { background: oklch(1 0 0 / 0.24); }
.lb-close { top: 22px; right: 22px; }
.lb-nav.prev { left: 18px; top: 50%; transform: translateY(-50%) rotate(180deg); }
.lb-nav.next { right: 18px; top: 50%; transform: translateY(-50%); }
.lb-count {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11.5px; color: oklch(1 0 0 / 0.75);
}
@media (max-width: 560px) {
  .lb-nav.prev { left: 8px; } .lb-nav.next { right: 8px; }
  .lb-close { top: 12px; right: 12px; }
}

/* ============================================================
   BOTONES Y UTILIDADES
   ============================================================ */
.btn.deshabilitado { opacity: 0.5; cursor: not-allowed; display: inline-flex; align-items: center; gap: 8px; }
.btn.cargando { opacity: 0.65; pointer-events: none; }
.centrado { display: flex; justify-content: center; padding-bottom: 60px; }
.zona-resultados { padding: 40px 40px 90px; }
@media (max-width: 760px) { .zona-resultados { padding: 26px 20px 60px; } }
.cat-grid { display: grid; gap: 16px; margin-top: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

.card:focus-visible, .exec-card:focus-visible, .tl-month:focus-visible,
.brand-tab:focus-visible, .nav-link:focus-visible, .btn:focus-visible,
.icon-btn:focus-visible, .rank-row:focus-visible, .poster:focus-visible {
  outline: 2px solid var(--signal); outline-offset: 3px; border-radius: var(--r-sm);
}

/* Salto de accesibilidad */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 500;
  background: var(--card); color: var(--ink); padding: 10px 16px;
  border: 1px solid var(--line-2); border-radius: 0 0 var(--r-sm) 0;
}
.skip-link:focus { left: 0; }

/* ============================================================
   TOAST
   ============================================================ */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 18px);
  z-index: 350; max-width: min(560px, 90vw);
  padding: 12px 20px; border-radius: 999px;
  background: var(--ink); color: var(--paper);
  font-size: 13.5px; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
.toast[data-tipo="ok"]    { border-left: 3px solid var(--teal); }
.toast[data-tipo="warn"]  { border-left: 3px solid var(--rel-medio); }
.toast[data-tipo="error"] { border-left: 3px solid #E0524B; }

/* ============================================================
   PANEL DE CAPTURA (solo si CONFIG.captura.habilitada = true)
   ============================================================ */
.fab-captura {
  position: fixed; right: 24px; bottom: 24px; z-index: 150;
  display: inline-flex; align-items: center; gap: 9px;
  padding: 13px 20px; border-radius: 999px;
  background: var(--grad); color: #fff; font-weight: 600; font-size: 14px;
  box-shadow: 0 6px 22px oklch(0.5 0.15 240 / 0.32);
  transition: transform .2s var(--ease);
}
.fab-captura:hover { transform: translateY(-2px); }
@media (max-width: 560px) { .fab-captura span { display: none; } .fab-captura { padding: 14px; } }

.captura-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw);
  z-index: 250; background: var(--card); border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg); padding: 26px 28px 40px; overflow-y: auto;
  transform: translateX(100%); transition: transform .38s var(--ease);
  visibility: hidden;
}
.captura-panel.abierto { transform: none; visibility: visible; }
.captura-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.captura-head h3 { font-family: var(--serif); font-size: 26px; font-weight: 700; }
.captura-nota { font-size: 13px; color: var(--ink-2); margin-bottom: 18px; }
.captura-errores { list-style: none; margin-bottom: 14px; }
.captura-errores li {
  font-size: 12.5px; color: #B3261E; background: #FDECEA;
  border-radius: var(--r-sm); padding: 7px 11px; margin-bottom: 6px;
}
.captura-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.captura-grid .campo.ancho { grid-column: span 2; }
@media (max-width: 560px) { .captura-grid { grid-template-columns: 1fr; } .captura-grid .campo.ancho { grid-column: auto; } }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo input, .campo textarea {
  font-family: inherit; font-size: 14px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); padding: 10px 12px; resize: vertical;
  transition: border-color .2s, box-shadow .2s;
}
.campo input:focus, .campo textarea:focus {
  outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft);
}
.captura-pie { display: flex; align-items: flex-end; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
.captura-pie .campo { flex: 1; min-width: 200px; }

/* ============================================================
   RESPONSIVE — refuerzos
   ============================================================ */
html, body { overflow-x: hidden; }

.solo-movil { display: none; }
@media (max-width: 880px) {
  .solo-movil { display: grid; }
  .nav-links {
    display: none; position: absolute; top: var(--nav-h); left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0; margin: 0;
    background: var(--card); border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow-md); padding: 8px;
  }
  .nav-links.abierto { display: flex; }
  .nav-link { text-align: left; padding: 13px 14px; border-radius: var(--r-sm); }
  .nav-link.active::after { display: none; }
  .nav-link.active { background: var(--signal-soft); }
}

@media (max-width: 760px) {
  .filterbar { padding: 12px 0; }
  .filterbar .filter-row:last-child {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; padding-bottom: 4px;
  }
  .filterbar .filter-row:last-child::-webkit-scrollbar { display: none; }
  .filterbar .select-wrap { flex: 0 0 auto; }
  .result-count { margin-left: 0; flex: 0 0 auto; }
  .fselect, .search { height: 46px; }          /* objetivo táctil ≥44px */
  .btn { padding: 13px 20px; }
  .icon-btn { width: 42px; height: 42px; }
  .grid { grid-template-columns: 1fr; gap: 18px; }
  .exec-grid { grid-template-columns: 1fr; }
  .section-head { flex-direction: column; align-items: flex-start; }
  .detail-sheet { margin: 0; border-radius: 0; min-height: 100vh; border: none; }
  .detail-close { top: 12px; right: 12px; width: 40px; height: 40px; }
  .detail-hero { aspect-ratio: 16/10; }
  .gallery { grid-template-columns: repeat(2, 1fr); }
  .gallery .poster:first-child { grid-column: span 2; }
  .insight-feature { padding: 32px 24px; }
  .tl-track { overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .tl-track::-webkit-scrollbar { display: none; }
  .tl-month { flex: 0 0 128px; }
  .tl-name { font-size: 22px; }
  .cmp-selectors { flex-direction: column; align-items: stretch; }
  .cmp-selectors .select-wrap, .cmp-selectors .fselect { width: 100%; }
  .footer .shell { flex-direction: column; align-items: flex-start; gap: 10px; }
  .skeleton-grid { grid-template-columns: 1fr; }
  .estado-carga { padding: 50px 20px 70px; }
}

/* Landscape en móviles bajos: el modal no debe cortar contenido */
@media (max-height: 480px) and (orientation: landscape) {
  .detail-hero { aspect-ratio: 21/7; }
  .captura-panel { padding-top: 14px; }
}

/* ============================================================
   MOVIMIENTO REDUCIDO — todo el contenido permanece disponible
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .reveal, .view-in { opacity: 1 !important; transform: none !important; }
  .chip-nuevo { animation: none; }
  .sync-sweep, .escaneando::after, .skeleton-card::after { display: none; }
  .if-radar-canvas { opacity: 0.5; }
  .card:hover { transform: none; }
  .btn:hover, .brand-tab:hover, .exec-card:hover, .fab-captura:hover { transform: none; }
  .detail-close:hover { transform: none; }
}

/* El motor también puede apagar el movimiento desde JS */
[data-motion="off"] .chip-nuevo { animation: none; }
[data-motion="off"] .reveal, [data-motion="off"] .view-in { opacity: 1; transform: none; }

/* ---------- Impresión ---------- */
@media print {
  .nav, .filterbar, .fab-captura, .captura-panel, .toast, .sync-sweep { display: none !important; }
  .app { padding-top: 0; }
  .card, .exec-card { break-inside: avoid; box-shadow: none; }
}


/* ============================================================
   PORTADA 16:9 — botón en tarjeta y editor
   ============================================================ */
.btn-portada {
  position: absolute; top: 12px; left: 12px; z-index: 4;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: 999px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 500;
  color: #fff; background: oklch(0.22 0.02 255 / 0.62);
  border: 1px solid oklch(1 0 0 / 0.28);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  opacity: 0; transform: translateY(-4px);
  transition: opacity .22s var(--ease), transform .22s var(--ease), background .2s;
}
.card:hover .btn-portada,
.card:focus-within .btn-portada,
.btn-portada:focus-visible { opacity: 1; transform: none; }
.btn-portada:hover { background: var(--teal); border-color: transparent; }
/* En pantallas táctiles no hay hover: el botón queda siempre visible */
@media (hover: none) { .btn-portada { opacity: 1; transform: none; } }

.portada-overlay {
  position: fixed; inset: 0; z-index: 380; display: grid; place-items: center;
  padding: 28px 18px; overflow-y: auto;
  background: color-mix(in oklch, var(--paper) 55%, oklch(0.2 0.01 60 / 0.55));
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  animation: fade .28s var(--ease) both;
}
.portada-panel {
  width: min(720px, 100%); background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg); padding: 24px 26px 26px;
  animation: sheetIn .42s var(--ease) both;
}
.portada-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.portada-head h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; line-height: 1.1; margin-top: 6px; }

.portada-marco {
  position: relative; aspect-ratio: 16/9; width: 100%;
  border-radius: var(--r-md); overflow: hidden;
  border: 1px dashed var(--line-2); background: var(--paper-2);
  display: grid; place-items: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.portada-marco.sobre { border-color: var(--signal); background: var(--signal-soft); }
.portada-canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
.portada-vacia {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  color: var(--ink-3); text-align: center; padding: 20px;
}
.portada-vacia span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.portada-vacia small { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; }

.portada-controles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.portada-controles label { display: flex; flex-direction: column; gap: 6px; }
.portada-controles input[type="range"] { width: 100%; accent-color: var(--teal); }
@media (max-width: 560px) { .portada-controles { grid-template-columns: 1fr; gap: 10px; } }

.portada-acciones { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
.portada-acciones .campo { flex: 1; min-width: 180px; }
.portada-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.portada-acciones label.btn { cursor: pointer; }

.portada-aviso { margin-top: 12px; font-size: 13px; color: #B3261E; min-height: 1px; }
.portada-nota { margin-top: 12px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }


/* ============================================================
   LECTURA DEL PERÍODO — texto + radar contenido (sin recortes)
   ============================================================ */
.insight-feature {
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(200px, 26vw, 300px);
  gap: 40px; align-items: center;
}
.if-texto { position: relative; z-index: 2; min-width: 0; }
.if-radar {
  position: relative; z-index: 2; margin: 0; justify-self: center;
  width: 100%; max-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px;
}
/* aspect-ratio 1 garantiza que el radar se vea completo y sin deformarse */
.if-radar-canvas {
  width: 100%; aspect-ratio: 1 / 1; height: auto; display: block;
  border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 50%, oklch(1 0 0 / 0.07), transparent 70%);
  border: 1px solid oklch(1 0 0 / 0.14);
}
.if-radar-pie {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in oklch, var(--paper) 62%, transparent); text-align: center;
}
@media (max-width: 880px) {
  .insight-feature { grid-template-columns: 1fr; gap: 28px; }
  .if-radar { order: -1; max-width: 220px; }
}

/* ============================================================
   FICHA EDITABLE
   ============================================================ */
.detail-barra {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--line);
}
.detail-barra .eyebrow { flex: 1; min-width: 200px; }
.btn-portada-ficha { flex-shrink: 0; }

.save-state {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-3);
  white-space: nowrap;
}
.save-state[data-estado="sucio"]     { color: #8A6D00; border-color: #E8D48A; background: #FFF8E1; }
.save-state[data-estado="guardando"] { color: var(--teal); border-color: color-mix(in oklch, var(--teal) 45%, var(--line)); }
.save-state[data-estado="ok"]        { color: #1B7A4B; border-color: #A9DCC0; background: #EAF7F0; }
.save-state[data-estado="error"]     { color: #B3261E; border-color: #F0B4B0; background: #FDECEA; }

.editable {
  border-radius: var(--r-sm); outline: none;
  transition: background .18s var(--ease), box-shadow .18s var(--ease);
  cursor: text; min-width: 40px;
}
.editable:hover  { background: color-mix(in oklch, var(--signal) 7%, transparent); }
.editable:focus  { background: var(--signal-soft); box-shadow: 0 0 0 2px var(--signal); }
.editable:empty::before {
  content: attr(data-vacio); color: var(--ink-3); font-style: italic; opacity: 0.8;
}
h1.editable, p.editable, span.editable { padding: 2px 6px; margin-left: -6px; }
.badge.editable { display: inline-block; }
.spec-icono { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spec-link { display: inline-flex; color: var(--ink-3); transition: color .2s; }
.spec-link:hover { color: var(--teal); }
.link-edit { word-break: break-all; font-size: 13px; }

/* ============================================================
   MODAL DE TOKEN
   ============================================================ */
.token-overlay {
  position: fixed; inset: 0; z-index: 420; display: grid; place-items: center; padding: 24px;
  background: oklch(0.16 0.02 255 / 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade .24s var(--ease) both;
}
.token-panel {
  width: min(460px, 100%); background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 26px;
}
.token-panel h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 8px 0 10px; }
.token-panel p { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; margin-bottom: 16px; }
.token-panel input {
  width: 100%; font-family: var(--mono); font-size: 14px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 11px 13px;
}
.token-panel input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.token-acciones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* ============================================================
   PORTADA — entrada de archivo visible
   ============================================================ */
.campo-archivo { flex: 1; min-width: 220px; }
.portada-file {
  font-family: inherit; font-size: 13px; color: var(--ink-2);
  background: var(--paper); border: 1px solid var(--line-2);
  border-radius: var(--r-sm); padding: 9px 11px; width: 100%; cursor: pointer;
}
.portada-file::file-selector-button {
  font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  margin-right: 12px; padding: 7px 14px; border: none; border-radius: 999px;
  background: var(--ink); color: var(--paper); transition: background .2s;
}
.portada-file::file-selector-button:hover { background: var(--teal); }
.portada-file:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.portada-aviso[data-tipo="info"]  { color: var(--ink-2); }
.portada-aviso[data-tipo="error"] { color: #B3261E; }

  </style>
</head>

/* ---------- texto ---------- */

/** Convierte cualquier valor a texto plano recortado. */
function texto(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/\u0000/g, "").trim();
}

/** Recorta a n caracteres sin cortar a la mitad de una palabra. */
function recortar(v, n) {
  const s = texto(v);
  if (s.length <= n) return s;
  const corte = s.slice(0, n);
  const esp = corte.lastIndexOf(" ");
  return (esp > n * 0.6 ? corte.slice(0, esp) : corte).trimEnd() + "…";
}

/** Escape HTML. Solo para los pocos casos donde se arma markup. */
function escapeHtml(v) {
  return texto(v)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

/** Normaliza encabezados: minúsculas, sin acentos ni símbolos. */
function norm(s) {
  return texto(s)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")

  const s = texto(v);
  if (!s) return [];
  return s.split(/[,;|\n]/).map(x => x.trim()).filter(Boolean);

function urlImagenDirecta(v) {
  const s = urlSegura(v);
  if (!s) return "";
  if (!/drive\.google\.com|docs\.google\.com/i.test(s)) return s;
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/);
  if (!m) m = s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if (!m) m = s.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : s;
}

/** Extrae el host para mostrarlo como etiqueta del enlace. */
function hostDe(v) {
  const s = urlSegura(v);
  if (!s) return "";
  try {
    return new URL(s).hostname.replace(/^www\./, "");
  } catch {
    return "";
  }
}

/* ---------- fechas ---------- */

const MESES = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
];

const pad2 = n => String(n).padStart(2, "0");
const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

/**
 * Acepta ISO (YYYY-MM-DD), DD/MM/YYYY y objetos Date serializados.
 * Devuelve {y, mo, d} o null. Nunca lanza.
 */
function parseFecha(v) {
  const s = texto(v);
  if (!s) return null;

  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return validaYmd(+m[1], +m[2], +m[3]);

  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return validaYmd(+m[3], +m[2], +m[1]);

  const dt = new Date(s);
  if (!isNaN(dt.getTime())) return validaYmd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());

  return null;
}

function validaYmd(y, mo, d) {
  if (!(y >= 1970 && y <= 2100)) return null;
  if (!(mo >= 1 && mo <= 12)) return null;
  if (!(d >= 1 && d <= 31)) return null;
  return { y, mo, d };
}

/** "2026-05-06" -> "6 de mayo" */
function fechaLegible(fp) {
  return fp ? `${fp.d} de ${MESES[fp.mo - 1]}` : "Sin fecha";
}

/* ---------- validación de registros (captura) ---------- */

const REGLAS = {
  "Categoría":          { requerido: true,  max: 80 },
  "Subcategoría":       { requerido: false, max: 80 },
  "Tipo de acción":     { requerido: true,  max: 80 },
  "Título":             { requerido: true,  max: 160 },
  "Resumen":            { requerido: true,  max: 320 },
  "Descripción":        { requerido: false, max: 8000 },
  "SKU involucrado":    { requerido: false, max: 200 },
  "Canal":              { requerido: false, max: 200 },
  "Ubicación":          { requerido: false, max: 160 },
  "Imagen principal":   { requerido: false, max: 800, url: true },
  "Imágenes adicionales": { requerido: false, max: 4000, urlLista: true },
  "Fuente":             { requerido: false, max: 200 },
  "Insight":            { requerido: false, max: 2000 },
  "Link de referencia": { requerido: false, max: 800, url: true }
};

/**
 * Valida un registro con las 14 columnas comerciales.
 * @returns {{valido:boolean, errores:Array<{campo:string,mensaje:string}>, limpio:Object}}
 */
function validarRegistro(reg) {
  const errores = [];
  const limpio = {};
  const fuente = reg || {};

  for (const campo of COLUMNAS_COMERCIALES) {
    const regla = REGLAS[campo] || { max: 500 };
    let valor = texto(fuente[campo]);

    if (regla.requerido && !valor) {
      errores.push({ campo, mensaje: `"${campo}" es obligatorio.` });
    }
    if (valor.length > regla.max) {
      errores.push({ campo, mensaje: `"${campo}" supera ${regla.max} caracteres.` });
      valor = valor.slice(0, regla.max);
    }
    if (regla.url && valor && !esUrl(valor)) {
      errores.push({ campo, mensaje: `"${campo}" debe ser una URL http(s) válida.` });
    }
    if (regla.urlLista && valor) {
      const malas = splitList(valor).filter(u => !esUrl(u));
      if (malas.length) {
        errores.push({ campo, mensaje: `"${campo}" contiene ${malas.length} URL inválida(s).` });
      }
    }
    limpio[campo] = valor;
  }

  // Columnas extendidas opcionales
  ["Marca", "Grupo", "Fecha"].forEach(c => {
    const v = texto(fuente[c]);
    if (v) limpio[c] = v.slice(0, 160);
  });

  if (limpio.Fecha && !parseFecha(limpio.Fecha)) {
    errores.push({ campo: "Fecha", mensaje: "Formato de fecha no reconocido (usa AAAA-MM-DD)." });
  }

  return { valido: errores.length === 0, errores, limpio };
}

/** Verifica que la hoja traiga las 14 columnas comerciales. */
function validarEncabezados(headers) {
  const presentes = new Set((headers || []).map(norm));
  const faltantes = COLUMNAS_COMERCIALES.filter(c => !presentes.has(norm(c)));
  return { valido: faltantes.length === 0, faltantes };
}

return { texto, recortar, escapeHtml, norm, splitList, esUrl, urlSegura, urlImagenDirecta, hostDe, MESES, pad2, cap, parseFecha, fechaLegible, validarRegistro, validarEncabezados };
})();

/* ==================== módulo: animations.js ==================== */
const __M_animations = (function () {
/* ============================================================
   Brandg · Radar Competitivo — Motor de animaciones
   ------------------------------------------------------------
   Único lugar donde vive la lógica de movimiento.
   Reglas duras:
   · Nada se anima "de adorno": toda animación responde a un dato
     o a una acción del usuario.
   · Se respeta prefers-reduced-motion.
   · Todo se pausa fuera del viewport y con la pestaña oculta.
   · Solo se animan transform / opacity / propiedades de canvas.
   ============================================================ */

const { ANIMATION_CONFIG: A } = __M_config;

/* ============================================================
   Estado global del motor
   ============================================================ */
const estado = {
  reducido: false,
  movil: false,
  perfil: A.perfil.medium,
  instancias: new Set(),      // objetos con .pausar() .reanudar() .destruir()
  observers: new Set(),
  iniciado: false
};

const mqReduce = typeof matchMedia === "function"
  ? matchMedia("(prefers-reduced-motion: reduce)")
  : { matches: false, addEventListener: () => {} };

function calcularPerfil() {
  estado.movil = window.innerWidth <= A.mobileBreakpoint;
  let nivel = A.intensity;
  if (A.reduceEffectsOnMobile && estado.movil) nivel = "low";
  // Dispositivos de baja capacidad: menos núcleos => perfil bajo
  if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) {
    nivel = nivel === "high" ? "medium" : "low";
  }
  estado.perfil = A.perfil[nivel] || A.perfil.medium;
}

function movimientoActivo() {
  return A.enabled && !(A.respectReducedMotion && estado.reducido);
}

/** Inicializa el motor. Idempotente. */
function init() {
  if (estado.iniciado) return;
  estado.iniciado = true;

  estado.reducido = !!mqReduce.matches;
  calcularPerfil();
  document.documentElement.dataset.motion = movimientoActivo() ? "on" : "off";

  if (typeof mqReduce.addEventListener === "function") {
    mqReduce.addEventListener("change", e => {
      estado.reducido = e.matches;
      document.documentElement.dataset.motion = movimientoActivo() ? "on" : "off";
      estado.instancias.forEach(i => (movimientoActivo() ? i.reanudar() : i.pausar()));
    });
  }

  let tResize;
  window.addEventListener("resize", () => {
    clearTimeout(tResize);
    tResize = setTimeout(() => {
      calcularPerfil();
      estado.instancias.forEach(i => i.redimensionar && i.redimensionar());
    }, 180);
  }, { passive: true });

  if (A.pauseWhenHidden) {
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) estado.instancias.forEach(i => i.pausar());
      else if (movimientoActivo()) estado.instancias.forEach(i => i.reanudar());
    });
  }
}

/** Libera todo. Se llama al cambiar de vista. */
function destruirTodo() {
  estado.instancias.forEach(i => i.destruir());
  estado.instancias.clear();
  estado.observers.forEach(o => o.disconnect());
  estado.observers.clear();
}

/* ============================================================
   1) RADAR — canvas 2D con barrido, anillos y blips reales
   ============================================================ */

class Radar {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {{blips?:Array, ambiental?:boolean}} opts
   *   blips: [{ang:0..1, dist:0..1, hue:number, nuevo:boolean, label:string}]
   */
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: true });
    this.blips = [];
    this.ambiental = opts.ambiental !== false;
    this.angulo = -Math.PI / 2;
    this.raf = null;
    this.visible = true;
    this.corriendo = false;
    this.ultimo = 0;
    this.ondas = [];               // ondas expansivas puntuales
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);

    this._colores();
    this.redimensionar();
    if (opts.blips) this.setBlips(opts.blips);

    if (A.pauseWhenOffscreen && "IntersectionObserver" in window) {
      this.io = new IntersectionObserver(ents => {
        this.visible = ents[0].isIntersecting;
        if (this.visible && movimientoActivo()) this.reanudar();
        else this.pausar();
      }, { threshold: 0.02 });
      this.io.observe(canvas);
      estado.observers.add(this.io);
    }

    estado.instancias.add(this);
    if (movimientoActivo() && A.radarEnabled) this.reanudar();
    else this.dibujarEstatico();
  }

  _colores() {
    const cs = getComputedStyle(document.documentElement);
    this.cTeal = (cs.getPropertyValue("--teal") || "#00BDB5").trim();
    this.cInk3 = (cs.getPropertyValue("--ink-3") || "#8A8A96").trim();
  }

  redimensionar() {
    const r = this.canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));
    const h = Math.max(1, Math.round(r.height));
    this.dpr = Math.min(window.devicePixelRatio || 1, estado.movil ? 1.5 : 2);
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.w = w;
    this.h = h;
    this.cx = w / 2;
    this.cy = h / 2;
    this.radio = Math.max(20, Math.min(w, h) / 2 - 6);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (!this.corriendo) this.dibujarEstatico();
  }

  /** Sustituye los puntos de detección. Los nuevos entran con onda. */
  setBlips(lista) {
    const max = estado.perfil.maxBlips;
    this.blips = (lista || []).slice(0, max).map(b => ({
      ang: (Number(b.ang) || 0) * Math.PI * 2 - Math.PI / 2,
      dist: Math.min(0.94, Math.max(0.16, Number(b.dist) || 0.5)),
      hue: Number(b.hue) || 192,
      nuevo: !!b.nuevo,
      brillo: 0
    }));
    if (!this.corriendo) this.dibujarEstatico();
  }

  /** Onda expansiva puntual: se usa al sincronizar o al detectar un registro. */
  emitirOnda() {
    if (!movimientoActivo()) return;
    this.ondas.push({ r: 0, a: 0.5 });
    if (this.ondas.length > 4) this.ondas.shift();
  }

  reanudar() {
    if (this.corriendo || !movimientoActivo() || !A.radarEnabled) return;
    this.corriendo = true;
    this.ultimo = performance.now();
    const paso = ts => {
      if (!this.corriendo) return;
      const intervalo = 1000 / estado.perfil.fps;
      if (ts - this.ultimo >= intervalo) {
        const dt = Math.min(120, ts - this.ultimo);
        this.ultimo = ts;
        this.actualizar(dt);
        this.dibujar();
      }
      this.raf = requestAnimationFrame(paso);
    };
    this.raf = requestAnimationFrame(paso);
  }

  pausar() {
    this.corriendo = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
  }

  destruir() {
    this.pausar();
    if (this.io) { this.io.disconnect(); estado.observers.delete(this.io); }
    estado.instancias.delete(this);
  }

  actualizar(dt) {
    // Barrido: una vuelta cada `sweepSeg` segundos
    this.angulo += (Math.PI * 2) * (dt / 1000) / estado.perfil.sweepSeg;
    if (this.angulo > Math.PI * 1.5) this.angulo -= Math.PI * 2;

    // Un blip se ilumina cuando el barrido lo cruza y luego se apaga
    this.blips.forEach(b => {
      let d = Math.abs(normaliza(this.angulo - b.ang));
      if (d < 0.12) b.brillo = 1;
      else b.brillo = Math.max(0, b.brillo - dt / 900);
    });

    this.ondas.forEach(o => { o.r += dt * 0.00042; o.a -= dt * 0.00055; });
    this.ondas = this.ondas.filter(o => o.a > 0.01);
  }

  dibujarEstatico() {
    if (!this.ctx) return;
    this.ctx.clearRect(0, 0, this.w, this.h);
    this.dibujarRejilla();
    this.blips.forEach(b => this.dibujarBlip(b, b.nuevo ? 0.9 : 0.55));
  }

  dibujar() {
    const c = this.ctx;
    c.clearRect(0, 0, this.w, this.h);
    this.dibujarRejilla();

    // Ondas expansivas
    this.ondas.forEach(o => {
      c.beginPath();
      c.arc(this.cx, this.cy, this.radio * o.r, 0, Math.PI * 2);
      c.strokeStyle = hexA(this.cTeal, Math.max(0, o.a));
      c.lineWidth = 1.4;
      c.stroke();
    });

    // Barrido (gradiente cónico emulado con sectores)
    if (A.particlesEnabled) {
      const pasos = 26;
      const arco = Math.PI / 3.2;
      for (let i = 0; i < pasos; i++) {
        const a0 = this.angulo - (arco * i) / pasos;
        const a1 = this.angulo - (arco * (i + 1)) / pasos;
        const alfa = (1 - i / pasos) * 0.14 * estado.perfil.glow;
        c.beginPath();
        c.moveTo(this.cx, this.cy);
        c.arc(this.cx, this.cy, this.radio, a1, a0);
        c.closePath();
        c.fillStyle = hexA(this.cTeal, alfa);
        c.fill();
      }
      // Línea guía del barrido
      c.beginPath();
      c.moveTo(this.cx, this.cy);
      c.lineTo(this.cx + Math.cos(this.angulo) * this.radio, this.cy + Math.sin(this.angulo) * this.radio);
      c.strokeStyle = hexA(this.cTeal, 0.5);
      c.lineWidth = 1.5;
      c.stroke();
    }

    this.blips.forEach(b => this.dibujarBlip(b, 0.35 + b.brillo * 0.65));
  }

  dibujarRejilla() {
    const c = this.ctx;
    [0.34, 0.62, 0.9].forEach((f, i) => {
      c.beginPath();
      c.arc(this.cx, this.cy, this.radio * f, 0, Math.PI * 2);
      c.strokeStyle = hexA(this.cInk3, 0.16 - i * 0.03);
      c.lineWidth = 1;
      c.stroke();
    });
    c.beginPath();
    c.moveTo(this.cx - this.radio, this.cy); c.lineTo(this.cx + this.radio, this.cy);
    c.moveTo(this.cx, this.cy - this.radio); c.lineTo(this.cx, this.cy + this.radio);
    c.strokeStyle = hexA(this.cInk3, 0.10);
    c.lineWidth = 1;
    c.stroke();
  }

  dibujarBlip(b, alfa) {
    const c = this.ctx;
    const x = this.cx + Math.cos(b.ang) * this.radio * b.dist;
    const y = this.cy + Math.sin(b.ang) * this.radio * b.dist;
    const r = b.nuevo ? 3.6 : 2.6;

    if (b.brillo > 0.05 || b.nuevo) {
      c.beginPath();
      c.arc(x, y, r + 6 * (b.nuevo ? 1 : b.brillo), 0, Math.PI * 2);
      c.fillStyle = `oklch(0.72 0.14 ${b.hue} / ${0.18 * alfa})`;
      c.fill();
    }
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fillStyle = `oklch(0.62 0.16 ${b.hue} / ${Math.min(1, alfa)})`;
    c.fill();
  }
}

function normaliza(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function hexA(color, alfa) {
  const a = Math.max(0, Math.min(1, alfa));
  const s = String(color).trim();
  if (s.startsWith("#")) {
    const h = s.length === 4
      ? s.slice(1).split("").map(x => x + x).join("")
      : s.slice(1, 7);
    const n = parseInt(h, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  }
  if (s.startsWith("oklch")) return s.replace(/\)$/, ` / ${a})`);
  return s;
}

/** Monta el radar del hero a partir de acciones reales. */
function montarRadar(canvas, acciones, refFecha) {
  if (!canvas) return null;
  return new Radar(canvas, { blips: blipsDesdeAcciones(acciones, refFecha) });
}

/**
 * Traduce acciones reales a puntos del radar.
 * ángulo  = posición de la categoría en el catálogo (agrupa por categoría)
 * radio   = antigüedad relativa (más reciente => más cerca del centro)
 */
function blipsDesdeAcciones(acciones, refFecha) {
  const lista = (acciones || []).filter(Boolean);
  if (!lista.length) return [];
  const cats = Array.from(new Set(lista.map(a => a.categoria))).sort();
  const ref = refFecha || lista.reduce((m, a) => (a.fecha > m ? a.fecha : m), "");
  const refT = Date.parse(ref) || Date.now();
  const rango = 1000 * 60 * 60 * 24 * 120;   // ventana de 120 días

  return lista.map((a, i) => {
    const ci = Math.max(0, cats.indexOf(a.categoria));
    const base = cats.length ? ci / cats.length : 0;
    const jitter = ((i * 37) % 100) / 100 / Math.max(1, cats.length);
    const t = Date.parse(a.fecha);
    const edad = isNaN(t) ? 0.85 : Math.min(1, Math.max(0, (refT - t) / rango));
    return {
      ang: base + jitter,
      dist: 0.22 + edad * 0.7,
      hue: a.__hue || 210,
      nuevo: !!a.__nuevo
    };
  });
}

/* ============================================================
   2) CONTADORES — el KPI cuenta hasta su valor real
   ============================================================ */
function contador(el, destino, opts = {}) {
  if (!el) return;
  const fin = Number(destino) || 0;
  const relleno = opts.pad || 0;
  const fmt = v => (relleno ? String(v).padStart(relleno, "0") : String(v));

  if (!movimientoActivo() || !A.countersEnabled) { el.textContent = fmt(fin); return; }

  const dur = Math.min(1100, 380 + fin * 22);
  const t0 = performance.now();
  let raf;
  const paso = ts => {
    const p = Math.min(1, (ts - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(fin * e));
    if (p < 1) raf = requestAnimationFrame(paso);
  };
  raf = requestAnimationFrame(paso);
  estado.instancias.add({
    pausar() { if (raf) cancelAnimationFrame(raf); el.textContent = fmt(fin); },
    reanudar() {},
    destruir() { if (raf) cancelAnimationFrame(raf); }
  });
}

/* ============================================================
   3) ENTRADA ESCALONADA — tarjetas que aparecen al entrar en pantalla
   ============================================================ */
function revelar(contenedor, selector = ":scope > *") {
  if (!contenedor) return;
  const hijos = Array.from(contenedor.querySelectorAll(selector));
  if (!movimientoActivo() || !A.transitionsEnabled) {
    hijos.forEach(h => h.classList.add("is-in"));
    return;
  }
  hijos.forEach(h => h.classList.add("reveal"));

  if (!("IntersectionObserver" in window)) {
    hijos.forEach(h => h.classList.add("is-in"));
    return;
  }
  const io = new IntersectionObserver((ents, obs) => {
    ents.forEach(e => {
      if (!e.isIntersecting) return;
      const i = hijos.indexOf(e.target);
      e.target.style.transitionDelay = Math.min(i * 45, 420) + "ms";
      e.target.classList.add("is-in");
      obs.unobserve(e.target);
    });
  }, { threshold: 0.06, rootMargin: "0px 0px -40px 0px" });

  hijos.forEach(h => io.observe(h));
  estado.observers.add(io);
}

/* ============================================================
   4) PULSO DE DETECCIÓN — registros nuevos / cambios recientes
   ============================================================ */
function pulsoDeteccion(el, veces = 2) {
  if (!el || !movimientoActivo() || !A.alertsEnabled) return;
  el.classList.remove("pulso-deteccion");
  void el.offsetWidth;                       // reinicia la animación
  el.style.setProperty("--pulsos", veces);
  el.classList.add("pulso-deteccion");
  el.addEventListener("animationend", () => el.classList.remove("pulso-deteccion"), { once: true });
}

/* ============================================================
   5) BARRIDO DE SINCRONIZACIÓN — feedback global al recargar datos
   ============================================================ */
let barridoEl = null;
function barridoSync(activo) {
  if (!movimientoActivo()) return;
  if (activo) {
    if (barridoEl) return;
    barridoEl = document.createElement("div");
    barridoEl.className = "sync-sweep";
    barridoEl.setAttribute("aria-hidden", "true");
    document.body.appendChild(barridoEl);
  } else if (barridoEl) {
    barridoEl.classList.add("out");
    const el = barridoEl;
    barridoEl = null;
    setTimeout(() => el.remove(), 420);
  }
}

/* ============================================================
   6) FEEDBACK DE FILTRO — línea de escaneo sobre la grilla
   ============================================================ */
function escanear(contenedor) {
  if (!contenedor || !movimientoActivo() || !A.transitionsEnabled) return;
  contenedor.classList.remove("escaneando");
  void contenedor.offsetWidth;
  contenedor.classList.add("escaneando");
  setTimeout(() => contenedor.classList.remove("escaneando"), 700);
}

/* ============================================================
   7) BARRAS DE RANKING — dibujado progresivo
   ============================================================ */
function animarBarra(el, porcentaje, retardoIdx = 0) {
  if (!el) return;
  const pct = Math.max(0, Math.min(100, porcentaje));
  if (!movimientoActivo() || !A.transitionsEnabled) { el.style.width = pct + "%"; return; }
  el.style.width = "0%";

/* ============================================================
   Brandg · Radar Competitivo — Capa de datos
   ------------------------------------------------------------
   · Transporte hacia Google Apps Script (GET lectura / POST escritura)
   · Timeout, reintentos con backoff, caché temporal
   · Normalización de filas de la hoja al modelo interno de la app
   ============================================================ */

const { CONFIG } = __M_config;
const { texto, norm, splitList, esUrl, urlSegura, urlImagenDirecta, parseFecha, fechaLegible, pad2, cap, MESES, validarEncabezados } = __M_validation;

   ============================================================ */

  origen: "desconocido",   // "sheets" | "cache"

/* ============================================================
   Token de escritura (nunca se guarda en el código)
   Vive en sessionStorage: muere al cerrar la pestaña.
   ============================================================ */
function tokenEscritura() {

}
function guardarTokenEscritura(t) {

/* Capacidades de escritura publicadas por el backend (action=health). */
const escritura = {

/** Consulta el modo de escritura del backend. No bloquea la carga. */
